# DORA question set for an indicative gap assessment.
#
# Source: Regulation (EU) 2022/2554 (DORA), the five pillars in Articles 5-16,
# 17-23, 24-27, 28-44 and 45. Question text is original. Article numbers say
# which duty the question is about; they are not a copy of the regulation.
#
# The same fields as nis2check/data/controls.yaml apply. `article` on a
# question is the specific provision; the domain article is the pillar range.
# `framework` keeps these questions out of a NIS2-only assessment.

version: "1.0"
source: "Regulation (EU) 2022/2554 (DORA)"
framework: dora

domains:
  - id: DIRM
    article: "Art. 5-16"
    verified: true
    checked_against: "Regulation (EU) 2022/2554, OJ L 333, 27.12.2022, p. 1, English edition, read 2026-11-23"
    evidence_quote: "The management body of the financial entity shall define, approve, oversee and be responsible for the implementation of all arrangements related to the ICT risk management framework"
    title: "ICT risk management"
    summary: >
      The management body owns ICT risk. The entity documents a framework
      that identifies the systems supporting critical functions, protects and
      monitors them, and can respond, recover and learn.
    questions:
      - id: DIRM-01
        article: "Art. 5"
        text: "Has the management body defined, approved, and taken responsibility for overseeing the implementation of the ICT risk management framework?"
        verified: true
        checked_against: "Regulation (EU) 2022/2554, OJ L 333, 27.12.2022, p. 1, English edition, read 2026-11-23"
        evidence_quote: "The management body of the financial entity shall define, approve, oversee and be responsible for the implementation of all arrangements related to the ICT risk management framework"
        priority: critical
        effort: low
        evidence_hint: "Management minutes and the named accountable role"
        remediation: "Record management approval of the ICT risk framework and name the accountable role."
      - id: DIRM-02
        article: "Art. 5"
        text: "Do members of the management body keep up to date with sufficient knowledge and skills to understand and assess ICT risk, including by following specific training, and do senior ICT staff report at least yearly to the management body on lessons from testing and incidents?"
        verified: true
        checked_against: "Regulation (EU) 2022/2554, OJ L 333, 27.12.2022, p. 1, English edition, read 2026-11-23"
        evidence_quote: "Members of the management body of the financial entity shall actively keep up to date with sufficient knowledge and skills to understand and assess ICT risk"
        priority: high
        effort: low
        attack_mitigations: [M1017]
        evidence_hint: "Training records and a recent ICT risk report to management"
        remediation: "Give the management body ICT risk training and a recurring risk report."
      - id: DIRM-03
        article: "Art. 6"
        text: "Is the ICT risk management framework documented, reviewed, and covering identification through to recovery?"
        verified: true
        checked_against: "Regulation (EU) 2022/2554, OJ L 333, 27.12.2022, p. 1, English edition, read 2026-11-23"
        evidence_quote: "The management body of the financial entity shall define, approve, oversee and be responsible for the implementation of all arrangements related to the ICT risk management framework"
        priority: critical
        effort: medium
        evidence_hint: "ICT risk framework with a review date"
        remediation: "Write the framework so it covers identification, protection, detection, response and recovery, and set a review cycle."
      - id: DIRM-04
        article: "Art. 7-8"
        text: "Are the ICT systems, protocols and tools that support critical or important functions identified, with an owner and the dependencies of each?"
        verified: true
        checked_against: "Regulation (EU) 2022/2554, OJ L 333, 27.12.2022, p. 1, English edition, read 2026-11-23"
        evidence_quote: "The management body of the financial entity shall define, approve, oversee and be responsible for the implementation of all arrangements related to the ICT risk management framework"
        priority: high
        effort: medium
        evidence_hint: "Inventory of systems, tools and dependencies, with owners"
        remediation: "Keep an inventory of the systems and tools that support critical functions, including what each one depends on."
      - id: DIRM-05
        article: "Art. 9-10"
        text: "Are the systems that support critical functions protected against common attacks and monitored so that anomalous activity is detected?"
        verified: true
        checked_against: "Regulation (EU) 2022/2554, OJ L 333, 27.12.2022, p. 1, English edition, read 2026-11-23"
        evidence_quote: "The management body of the financial entity shall define, approve, oversee and be responsible for the implementation of all arrangements related to the ICT risk management framework"
        priority: high
        effort: high
        attack_mitigations: [M1047, M1049]
        evidence_hint: "Protection standard and monitoring or alert records"
        remediation: "Apply a protection baseline and monitoring on the systems that support critical functions."
      - id: DIRM-06
        article: "Art. 11-12"
        text: "Are response and recovery procedures in place, including backups of critical data and a tested restore?"
        verified: true
        checked_against: "Regulation (EU) 2022/2554, OJ L 333, 27.12.2022, p. 1, English edition, read 2026-11-23"
        evidence_quote: "The management body of the financial entity shall define, approve, oversee and be responsible for the implementation of all arrangements related to the ICT risk management framework"
        priority: critical
        effort: medium
        attack_mitigations: [M1053]
        evidence_hint: "Response and recovery procedure, backup report, restore test record"
        remediation: "Document response and recovery, keep protected backups of critical data, and test a restore."
      - id: DIRM-07
        article: "Art. 13"
        text: "Are lessons from ICT incidents and from tests used to update the risk framework?"
        verified: true
        checked_against: "Regulation (EU) 2022/2554, OJ L 333, 27.12.2022, p. 1, English edition, read 2026-11-23"
        evidence_quote: "The management body of the financial entity shall define, approve, oversee and be responsible for the implementation of all arrangements related to the ICT risk management framework"
        priority: medium
        effort: low
        evidence_hint: "Lessons log and a framework change that followed one"
        remediation: "After a significant incident or test, record what will change in the framework and make the change."
      - id: DIRM-08
        article: "Art. 14"
        text: "Is there a plan for who is told, inside and outside the entity, during a major ICT disruption?"
        verified: true
        checked_against: "Regulation (EU) 2022/2554, OJ L 333, 27.12.2022, p. 1, English edition, read 2026-11-23"
        evidence_quote: "The management body of the financial entity shall define, approve, oversee and be responsible for the implementation of all arrangements related to the ICT risk management framework"
        priority: medium
        effort: medium
        attack_mitigations: [M1060]
        evidence_hint: "Communication plan and an out-of-band contact list"
        remediation: "Write who communicates during a major disruption, including a channel that still works if the usual tools are down."
      - id: DIRM-09
        article: "Art. 16"
        text: "Where the entity is a type listed in Article 16(1), are Articles 5 to 15 not applied and is the simplified ICT risk management framework maintained? Where it is not such a type, are Articles 5 to 15 the framework applied?"
        verified: true
        checked_against: "Regulation (EU) 2022/2554, OJ L 333, 27.12.2022, p. 1, English edition, read 2026-11-23"
        evidence_quote: "Articles 5 to 15 of this Regulation shall not apply to small and non-interconnected investment firms"
        priority: medium
        effort: low
        evidence_hint: "A short note of the framework applied and the rules that go with it"
        remediation: "Record which framework you apply and the detailed rules that come with it, and review the choice when the entity changes."

  - id: DIIM
    article: "Art. 17-23"
    verified: true
    checked_against: "Regulation (EU) 2022/2554, OJ L 333, 27.12.2022, p. 1, English edition, read 2026-11-23"
    evidence_quote: "Financial entities shall report major ICT-related incidents to the relevant competent authority"
    title: "ICT incident management and reporting"
    summary: >
      ICT incidents are detected, classified and handled. Major incidents
      are reported to the competent authority, and feedback from that
      authority is tracked.
    questions:
      - id: DIIM-01
        article: "Art. 17"
        text: "Is there an ICT incident process with roles, a log, and the steps from detection through to recovery?"
        verified: true
        checked_against: "Regulation (EU) 2022/2554, OJ L 333, 27.12.2022, p. 1, English edition, read 2026-11-23"
        evidence_quote: "Financial entities shall report major ICT-related incidents to the relevant competent authority"
        priority: critical
        effort: medium
        evidence_hint: "Incident process and an incident log"
        remediation: "Adopt an incident process with named roles, a log, and the steps from detection to recovery."
      - id: DIIM-02
        article: "Art. 18"
        text: "Are ICT incidents and cyber threats classified, including what makes an incident a major ICT-related incident?"
        verified: true
        checked_against: "Regulation (EU) 2022/2554, OJ L 333, 27.12.2022, p. 1, English edition, read 2026-11-23"
        evidence_quote: "Financial entities shall report major ICT-related incidents to the relevant competent authority"
        priority: high
        effort: low
        evidence_hint: "Classification criteria, including the major-incident threshold"
        remediation: "Write classification criteria and the threshold at which an incident is major."
      - id: DIIM-03
        article: "Art. 19"
        text: "Is there a procedure to send the initial, intermediate and final reports of a major ICT-related incident to the competent authority on time?"
        verified: true
        checked_against: "Regulation (EU) 2022/2554, OJ L 333, 27.12.2022, p. 1, English edition, read 2026-11-23"
        evidence_quote: "Financial entities shall report major ICT-related incidents to the relevant competent authority"
        priority: critical
        effort: low
        evidence_hint: "Reporting procedure, authority contact and report templates"
        remediation: "Name who reports, to which authority, and how the initial, intermediate and final reports are produced on time."
      - id: DIIM-04
        article: "Art. 19-20"
        text: "Do major-incident reports follow the content the authority expects, and can a significant cyber threat be notified on a voluntary basis?"
        verified: true
        checked_against: "Regulation (EU) 2022/2554, OJ L 333, 27.12.2022, p. 1, English edition, read 2026-11-23"
        evidence_quote: "Financial entities shall report major ICT-related incidents to the relevant competent authority"
        priority: medium
        effort: low
        evidence_hint: "Report template mapped to the expected content, and a note on voluntary threat notification"
        remediation: "Align the report templates with the expected content, and record how a significant cyber threat can be notified voluntarily."
      - id: DIIM-05
        article: "Art. 21-22"
        text: "Is the competent authority that receives major ICT-related incident reports identified, and does the entity remain responsible for handling the incident where that authority provides feedback?"
        verified: true
        checked_against: "Regulation (EU) 2022/2554, OJ L 333, 27.12.2022, p. 1, English edition, read 2026-11-23"
        evidence_quote: "financial entities shall remain fully responsible for the handling and for consequences of the ICT-related incidents reported"
        priority: medium
        effort: low
        evidence_hint: "Authority contact and a log of feedback and the response to it"
        remediation: "Record the authority that receives reports, including where reporting is centralised, and log supervisory feedback until it is closed."
      - id: DIIM-06
        article: "Art. 23"
        text: "Where the entity is a credit institution, a payment institution, an account information service provider or an electronic money institution, are operational or security payment-related incidents reported under the same Chapter III rules as ICT-related incidents?"
        verified: true
        checked_against: "Regulation (EU) 2022/2554, OJ L 333, 27.12.2022, p. 1, English edition, read 2026-11-23"
        evidence_quote: "The requirements laid down in this Chapter shall also apply to operational or security payment-related incidents"
        priority: high
        effort: medium
        evidence_hint: "Payment-incident reporting procedure, or a note that payment services are not provided"
        remediation: "Add a path for payment-related operational or security incidents, or mark this not applicable if you do not provide those services."

  - id: DDOT
    article: "Art. 24-27"
    verified: true
    checked_against: "Regulation (EU) 2022/2554, OJ L 333, 27.12.2022, p. 1, English edition, read 2026-11-23"
    evidence_quote: "financial entities, other than microenterprises, shall ensure, at least yearly, that appropriate tests are conducted on all ICT systems and applications supporting critical or important functions"
    title: "Digital operational resilience testing"
    summary: >
      The entity tests the ICT systems that support critical functions, in
      proportion to its size and risk, and uses testers who are independent
      of the teams they test.
    questions:
      - id: DDOT-01
        article: "Art. 24"
        text: "Where the entity is not a microenterprise, is there a digital operational resilience testing programme as an integral part of the ICT risk management framework?"
        verified: true
        checked_against: "Regulation (EU) 2022/2554, OJ L 333, 27.12.2022, p. 1, English edition, read 2026-11-23"
        evidence_quote: "financial entities, other than microenterprises, shall ensure, at least yearly, that appropriate tests are conducted on all ICT systems and applications supporting critical or important functions"
        priority: critical
        effort: medium
        evidence_hint: "Testing programme with scope and frequency"
        remediation: "Write a testing programme that says what is tested, how often, and why that matches your risk."
      - id: DDOT-02
        article: "Art. 24"
        text: "Where the entity is not a microenterprise, have appropriate tests been conducted at least yearly on all ICT systems and applications supporting critical or important functions?"
        verified: true
        checked_against: "Regulation (EU) 2022/2554, OJ L 333, 27.12.2022, p. 1, English edition, read 2026-11-23"
        evidence_quote: "financial entities, other than microenterprises, shall ensure, at least yearly, that appropriate tests are conducted on all ICT systems and applications supporting critical or important functions"
        priority: high
        effort: medium
        attack_mitigations: [M1016]
        evidence_hint: "Test reports from the last 12 months"
        remediation: "Run and record at least an annual test of the systems that support critical functions."
      - id: DDOT-03
        article: "Art. 26"
        text: "Where the entity is identified for threat-led penetration testing under Article 26(8), and is not a microenterprise or an Article 16(1) entity, is TLPT carried out at least every 3 years, with the scope validated by the competent authorities?"
        verified: true
        checked_against: "Regulation (EU) 2022/2554, OJ L 333, 27.12.2022, p. 1, English edition, read 2026-11-23"
        evidence_quote: "shall carry out at least every 3 years advanced testing by means of TLPT"
        priority: high
        effort: high
        evidence_hint: "Threat-led test plan or report and the agreed scope, or a note that it does not apply"
        remediation: "Confirm whether threat-led penetration testing applies. If it does, agree the scope and schedule the test; if it does not, mark this not applicable."
      - id: DDOT-04
        article: "Art. 24"
        text: "Are tests undertaken by independent parties, internal or external, and are weaknesses revealed by the tests fully addressed?"
        verified: true
        checked_against: "Regulation (EU) 2022/2554, OJ L 333, 27.12.2022, p. 1, English edition, read 2026-11-23"
        evidence_quote: "financial entities, other than microenterprises, shall ensure that tests are undertaken by independent parties, whether internal or external"
        priority: medium
        effort: medium
        evidence_hint: "Tester independence record and retest evidence"
        remediation: "Use testers who are independent of the system owner, and track each finding through to a retest."

  - id: DTPR
    article: "Art. 28-44"
    verified: true
    checked_against: "Regulation (EU) 2022/2554, OJ L 333, 27.12.2022, p. 1, English edition, read 2026-11-23"
    evidence_quote: "financial entities shall manage ICT third-party risk as an integral component of ICT risk"
    title: "ICT third-party risk"
    summary: >
      ICT third-party risk is managed inside the ICT risk framework, with a
      strategy where Article 28(2) applies, a register, a check before a new
      arrangement, contract elements in Article 30, and exit strategies for
      services that support critical or important functions. Once the competent
      authority passes on risks identified in a Lead Overseer recommendation,
      the entity takes those risks into account (Article 42(3)).
    questions:
      - id: DTPR-01
        article: "Art. 28"
        text: "Where the entity is not a microenterprise and not an Article 16(1) entity, is there a strategy on ICT third-party risk that includes a policy on the use of ICT services supporting critical or important functions?"
        verified: true
        checked_against: "Regulation (EU) 2022/2554, OJ L 333, 27.12.2022, p. 1, English edition, read 2026-11-23"
        evidence_quote: "financial entities shall manage ICT third-party risk as an integral component of ICT risk"
        priority: critical
        effort: medium
        threat_patterns: [supply_chain]
        evidence_hint: "ICT third-party risk strategy"
        remediation: "Write the strategy, including which critical or important functions may rely on an ICT provider."
      - id: DTPR-02
        article: "Art. 28"
        text: "Is the register of information on all contractual arrangements for ICT services maintained, distinguishing arrangements that support critical or important functions from those that do not?"
        verified: true
        checked_against: "Regulation (EU) 2022/2554, OJ L 333, 27.12.2022, p. 1, English edition, read 2026-11-23"
        evidence_quote: "financial entities shall manage ICT third-party risk as an integral component of ICT risk"
        priority: critical
        effort: low
        threat_patterns: [supply_chain]
        evidence_hint: "Register of ICT contractual arrangements"
        remediation: "Keep a register of every ICT arrangement, with the function and the data it supports."
      - id: DTPR-03
        article: "Art. 28-29"
        text: "Before a new ICT arrangement, is concentration risk assessed, including how hard that provider would be to replace?"
        verified: true
        checked_against: "Regulation (EU) 2022/2554, OJ L 333, 27.12.2022, p. 1, English edition, read 2026-11-23"
        evidence_quote: "financial entities shall manage ICT third-party risk as an integral component of ICT risk"
        priority: high
        effort: medium
        threat_patterns: [supply_chain]
        evidence_hint: "Concentration and substitutability assessment for a recent arrangement"
        remediation: "Assess concentration and how easily the provider could be replaced before you sign, and keep the record."
      - id: DTPR-04
        article: "Art. 30"
        text: "Do ICT service contracts include the Article 30(2) elements, including service locations, incident assistance and whether subcontracting is permitted, and, where the service supports a critical or important function, the audit rights and exit strategies in Article 30(3)?"
        verified: true
        checked_against: "Regulation (EU) 2022/2554, OJ L 333, 27.12.2022, p. 1, English edition, read 2026-11-23"
        evidence_quote: "The contractual arrangements on the use of ICT services shall include at least the following elements"
        priority: high
        effort: medium
        threat_patterns: [supply_chain]
        evidence_hint: "Contract checklist and a signed contract checked against it"
        remediation: "Check ICT contracts against those clauses and record any approved exception."
      - id: DTPR-05
        article: "Art. 28"
        text: "For ICT services supporting critical or important functions, are exit strategies in place, documented, sufficiently tested and reviewed periodically?"
        verified: true
        checked_against: "Regulation (EU) 2022/2554, OJ L 333, 27.12.2022, p. 1, English edition, read 2026-11-23"
        evidence_quote: "For ICT services supporting critical or important functions, financial entities shall put in place exit strategies"
        priority: high
        effort: medium
        threat_patterns: [supply_chain]
        evidence_hint: "Exit plans with a review date"
        remediation: "Write an exit plan for each provider that supports a critical or important function, and review it when the service changes."
      - id: DTPR-06
        article: "Art. 42"
        text: "When managing ICT third-party risk, does the entity take into account the risks identified in the Lead Overseer's recommendations once the competent authority has informed it of those risks?"
        verified: true
        checked_against: "Regulation (EU) 2022/2554, OJ L 333, 27.12.2022, p. 1, English edition, read 2026-11-23"
        evidence_quote: "When managing ICT third-party risk, financial entities shall take into account the risks referred to in the first subparagraph"
        priority: medium
        effort: low
        evidence_hint: "List of designated providers, or a note that none are designated, and a log of findings"
        remediation: "Know which providers are designated as critical, keep the information the authority may request, and track oversight findings. Mark this not applicable if none of your providers is designated."

  - id: DISH
    article: "Art. 45"
    verified: true
    checked_against: "Regulation (EU) 2022/2554, OJ L 333, 27.12.2022, p. 1, English edition, read 2026-11-23"
    evidence_quote: "Financial entities may exchange amongst themselves cyber threat information and intelligence"
    title: "Information sharing"
    summary: >
      The entity decides whether to exchange cyber threat information with
      others, and writes down the conditions before anything is shared.
    questions:
      - id: DISH-01
        article: "Art. 45"
        text: "Where the entity exchanges cyber threat information under Article 45, does the arrangement meet the conditions in Article 45(1), and has participation been notified to the competent authority?"
        verified: true
        checked_against: "Regulation (EU) 2022/2554, OJ L 333, 27.12.2022, p. 1, English edition, read 2026-11-23"
        evidence_quote: "Financial entities may exchange amongst themselves cyber threat information and intelligence"
        priority: medium
        effort: low
        attack_mitigations: [M1019]
        evidence_hint: "Recorded decision, and the arrangement name if you joined one"
        remediation: "Decide whether to take part in a threat-information arrangement and record the decision."
      - id: DISH-02
        article: "Art. 45"
        text: "Where threat information is shared, are the conditions written down, covering what may be shared, with whom, and how personal data is protected?"
        verified: true
        checked_against: "Regulation (EU) 2022/2554, OJ L 333, 27.12.2022, p. 1, English edition, read 2026-11-23"
        evidence_quote: "Financial entities may exchange amongst themselves cyber threat information and intelligence"
        priority: medium
        effort: low
        evidence_hint: "Written sharing conditions, or a note that nothing is shared"
        remediation: "Write the sharing conditions before any information is exchanged. Mark this not applicable if you do not share."
