national_extras:
- id: hu-reg-01
  text: Megküldte a szervezet az SZTFH-nak a nyilvántartásba vételhez szükséges adatokat a működés megkezdésétől vagy a törvény
    hatálya alá kerüléstől számított 30 napon belül?
  text_en: Has the organisation sent SZTFH the data required for registration within 30 days of starting operations or of
    coming within the Act?
  priority: critical
  effort: low
  evidence_hint: SZTFH 420 űrlap, nyilvántartásba vételi döntés
  remediation: Nyújtsa be a nyilvántartásba vételi kérelmet az SZTFH-hoz, és őrizze meg a döntést.
  article: 8. § (5)
  source_url: https://njt.hu/jogszabaly/2024-69-00-00
  verified: false
  note: 8. § (5) is the reading for organisations under 1. § (1) b) that are also in annexes 2 and 3, and for 1. § (1) d)
    and e). Other organisations notify the national cybersecurity authority under 8. § (4). Unverified.
- id: hu-audit-01
  text: Kötött a szervezet a nyilvántartásba vételtől számított 120 napon belül szerződést az SZTFH nyilvántartásában szereplő
    auditorral, és elvégezteti az első kiberbiztonsági auditot a nyilvántartásba vételtől számított két éven belül?
  text_en: Has the organisation contracted an auditor listed in the SZTFH register within 120 days of registration, and will
    the first cybersecurity audit be completed within two years of registration?
  priority: critical
  effort: high
  evidence_hint: Auditori szerződés, az auditor nyilvántartási száma, auditütemezés
  remediation: Kössön szerződést SZTFH-nyilvántartásban szereplő auditorral. Önértékelés nem helyettesíti az auditot.
  article: 16. § (2)
  source_url: https://njt.hu/jogszabaly/2024-69-00-00
  verified: false
  note: 16. § (1) is the reading for a biennial audit. 21. § (9) lets the president of SZTFH set the procedure and the maximum
    fee by decree. SZTFH Decree 1/2025 was named as that decree and was not opened, so its number is not confirmed here. There
    is no self-assessment alternative in the sections that were read. Unverified.
- id: hu-class-01
  text: Sorolta a szervezet az elektronikus információs rendszereit alap, jelentős vagy magas biztonsági osztályba, és alkalmazza
    az osztályhoz előírt védelmi intézkedéseket?
  text_en: Has the organisation classified its electronic information systems as basic, significant or high, and does it apply
    the protective measures required for that class?
  priority: high
  effort: high
  evidence_hint: Biztonsági osztályba sorolás dokumentuma, az osztályhoz tartozó intézkedések listája
  remediation: Végezzék el a biztonsági osztályba sorolást, és vezessék be a miniszteri rendelet szerinti intézkedéseket.
  article: 10. §
  source_url: https://njt.hu/jogszabaly/2024-69-00-00
  verified: false
  note: 10. § (1) names the three classes. 10. § (3) says the minister responsible for IT sets the requirements and the measures
    by decree. That decree was not opened, so no decree number is given. Unverified.
- id: hu-incident-01
  text: Ha a szervezetnél nincs a kiberbiztonsági incidens kezelésére megfelelő szaktudású foglalkoztatott, az incidens kezelését
    az SZTFH nyilvántartásában szereplő gazdálkodó szervezetre bízták?
  text_en: If the organisation has no employee with the right expertise to handle a cybersecurity incident, has incident handling
    been entrusted to an organisation listed in the SZTFH register for that purpose?
  priority: high
  effort: medium
  evidence_hint: Megbízási szerződés az SZTFH-nyilvántartásban szereplő szervezettel, vagy a belső szakértelem igazolása
  remediation: Vagy foglalkoztasson megfelelő szakembert, vagy bízzon meg az SZTFH nyilvántartásában szereplő szervezetet.
  article: 70. § (3) és (7)
  source_url: https://njt.hu/jogszabaly/2024-69-00-00
  verified: false
  note: 70. § (3) a) allows the organisation to handle the incident itself when it employs someone with suitable expertise.
    Otherwise 70. § (7), for the organisations in 1. § (1) d) and e), says it chooses from the SZTFH register. Unverified.
- id: hu-fee-01
  text: Megfizeti a szervezet az éves kiberbiztonsági felügyeleti díjat az SZTFH-nak?
  text_en: Does the organisation pay the annual cybersecurity supervision fee to SZTFH?
  priority: medium
  effort: low
  evidence_hint: Díjfizetés bizonylata, árbevétel-számítás
  remediation: Állapítsa meg a díjat az SZTFH elnökének rendelete szerint, és fizessék meg.
  article: 7. §
  source_url: https://njt.hu/jogszabaly/2024-69-00-00
  verified: false
  note: 7. § (2) is the reading for a cap of 0.015 percent of net turnover and at most 10 million forint, with a 50 million
    forint cap for a group. The payment date is in the presidential decree, which was not opened. Unverified.
- id: hu-officer-01
  text: Kijelölte a szervezet vezetője az elektronikus információs rendszer biztonságáért felelős személyt, és az a személy
    megfelel a törvényben írt feltételeknek?
  text_en: Has the head of the organisation designated the person responsible for the security of electronic information systems,
    and does that person meet the conditions set in the Act?
  priority: high
  effort: medium
  evidence_hint: Kijelölés, végzettség vagy szakmai gyakorlat igazolása, összeférhetetlenség vizsgálata
  remediation: Jelöljék ki a felelős személyt. A 11. § (3) szerint cselekvőképesnek és büntetlen előéletűnek kell lennie;
    egyes szervezeteknél a miniszteri rendelet szerinti végzettség vagy gyakorlat is kell.
  article: 11. §
  source_url: https://njt.hu/jogszabaly/2024-69-00-00
  verified: false
  note: The statutory title is elektronikus információs rendszer biztonságáért felelős személy. 11. § (4) limits who may not
    be appointed, with exceptions for important organisations and for 1. § (1) d) and e). Unverified.
incident_clocks:
  source_url: https://njt.hu/jogszabaly/2024-69-00-00
  verified: false
  note: 66. § requires a report without delay, as a government decree specifies. The Act section that was read does not replace
    the Directive's 24 hours, 72 hours or one month, so those clocks are kept.
deadlines:
- id: hu-register
  description: Nyilvántartásba vétel az SZTFH-nál a működés megkezdésétől vagy a hatályba kerüléstől számított 30 napon belül.
  description_en: Registration with SZTFH within 30 days of starting operations or coming into scope.
  relative: 30 days from starting operations or coming into scope
  source_url: https://njt.hu/jogszabaly/2024-69-00-00
  verified: false
  note: 8. § (5), unverified.
- id: hu-auditor-contract
  description: Szerződés SZTFH-nyilvántartásbeli auditorral a nyilvántartásba vételtől számított 120 napon belül, első audit
    két éven belül.
  description_en: Contract with an SZTFH-registered auditor within 120 days of registration, and the first audit within two
    years.
  relative: 120 days to contract, 2 years to the first audit, from registration
  source_url: https://njt.hu/jogszabaly/2024-69-00-00
  verified: false
  note: 16. § (2), unverified. SZTFH's own page also states these two periods for organisations registered after the Act took
    effect.
notices:
- id: hu-auditor
  text: A kiberbiztonsági auditot az SZTFH nyilvántartásában szereplő auditor végzi. Ennek az eszköznek a kimutatása csak
    előkészítő anyag. Nem audit és nem hivatalos beadvány.
  text_en: An auditor registered with SZTFH must perform the cybersecurity audit. This tool's output is preparation material
    only. It is not the audit and it is not an official filing.
  source_url: https://njt.hu/jogszabaly/2024-69-00-00
  status: ''
  scored: false
