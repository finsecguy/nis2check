national_extras:
- id: hu-reg-01
  text: Az 1. § (1) b) pontja szerinti és egyúttal a 2. és 3. melléklet szerinti szervezet, valamint az
    1. § (1) d) és e) pontja szerinti szervezet megküldte az SZTFH-nak a nyilvántartási adatokat a működés
    megkezdésétől vagy a hatály alá kerüléstől számított 30 napon belül?
  text_en: Where the organisation is covered by section 1(1)(b) and also by annexes 2 and 3, or by section
    1(1)(d) or (e), has it sent SZTFH the registration data within 30 days of starting operations or of
    coming within the Act?
  priority: critical
  effort: low
  evidence_hint: SZTFH 420 űrlap, nyilvántartásba vételi döntés
  remediation: Nyújtsa be a nyilvántartásba vételi kérelmet az SZTFH-hoz, és őrizze meg a döntést.
  article: 8. § (5)
  source_url: https://njt.jog.gov.hu/jogszabaly/2024-69-00-00
  verified: true
  note: 8. § (4) a) is a different 30-day notice, to the national cybersecurity authority, for organisations
    in 1. § (1) a) to c) and f).
  evidence_quote: 30 napon belül a 29. § (1) bekezdés a) pontjában meghatározott adatokat megküldeni az
    SZTFH részére
  checked_against: 2024. évi LXIX. törvény, Nemzeti Jogszabálytár njt.jog.gov.hu, időállapot 2026.10.01,
    read 2026-11-27
- id: hu-audit-01
  text: A 16. § (1) hatálya alá tartozó szervezet a nyilvántartásba vételtől számított 120 napon belül
    szerződést kötött az SZTFH nyilvántartásában szereplő auditorral, és az első auditot a nyilvántartásba
    vételtől számított két éven belül elvégezteti?
  text_en: Where section 16(1) applies, has the organisation contracted an auditor in the SZTFH register
    within 120 days of registration, and will the first audit be completed within two years of registration?
  priority: critical
  effort: high
  evidence_hint: Auditori szerződés, az auditor nyilvántartási száma, auditütemezés
  remediation: Kössön szerződést SZTFH-nyilvántartásban szereplő auditorral. Önértékelés nem helyettesíti
    az auditot.
  article: 16. § (1) és (2)
  source_url: https://njt.jog.gov.hu/jogszabaly/2024-69-00-00
  verified: true
  note: '16. § (1) also requires an audit every two years. It applies to annex 2 and 3 organisations that
    are also in 1. § (1) b), to 1. § (1) d), and to 1. § (1) e) except a microenterprise. 89. § (1a) and
    (2): an organisation in that group that started before 1 January 2025 must contract by 31 August 2025
    and complete the first audit by 30 June 2026. No self-assessment alternative is in 16. §.'
  evidence_quote: a nyilvántartásba vételét követő 120 napon belül a kiberbiztonsági audit elvégzésére
    megállapodást kötni
  checked_against: 2024. évi LXIX. törvény, Nemzeti Jogszabálytár njt.jog.gov.hu, időállapot 2026.10.01,
    read 2026-11-27
- id: hu-class-01
  text: Sorolta a szervezet az elektronikus információs rendszereit alap, jelentős vagy magas biztonsági
    osztályba, és alkalmazza az osztályhoz előírt védelmi intézkedéseket?
  text_en: Has the organisation classified its electronic information systems as basic, significant or
    high, and does it apply the protective measures required for that class?
  priority: high
  effort: high
  evidence_hint: Biztonsági osztályba sorolás dokumentuma, az osztályhoz tartozó intézkedések listája
  remediation: Végezzék el a biztonsági osztályba sorolást, és vezessék be a miniszteri rendelet szerinti
    intézkedéseket.
  article: 10. § (1) és (4)
  source_url: https://njt.jog.gov.hu/jogszabaly/2024-69-00-00
  verified: true
  note: 10. § (3) leaves the concrete measures to a decree of the minister responsible for IT. That decree
    was not opened, so no decree number is given.
  evidence_quote: „alap”, „jelentős” vagy „magas” biztonsági osztályba sorolja
  checked_against: 2024. évi LXIX. törvény, Nemzeti Jogszabálytár njt.jog.gov.hu, időállapot 2026.10.01,
    read 2026-11-27
- id: hu-incident-01
  text: Ha a szervezetnél nincs a kiberbiztonsági incidens kezelésére megfelelő szaktudású foglalkoztatott,
    az incidens kezelését az SZTFH nyilvántartásában szereplő gazdálkodó szervezetre bízták?
  text_en: If the organisation has no employee with the right expertise to handle a cybersecurity incident,
    has incident handling been entrusted to an organisation listed in the SZTFH register for that purpose?
  priority: high
  effort: medium
  evidence_hint: Megbízási szerződés az SZTFH-nyilvántartásban szereplő szervezettel, vagy a belső szakértelem
    igazolása
  remediation: Vagy foglalkoztasson megfelelő szakembert, vagy bízzon meg az SZTFH nyilvántartásában szereplő
    szervezetet.
  article: 70. § (3) és (7)
  source_url: https://njt.jog.gov.hu/jogszabaly/2024-69-00-00
  verified: true
  note: 70. § (7) requires an organisation in 1. § (1) d) or e) that does not handle the incident itself
    to choose a firm from the SZTFH register.
  evidence_quote: megfelelő szaktudással rendelkező foglalkoztatott alkalmazása esetén a szervezet önmaga
  checked_against: 2024. évi LXIX. törvény, Nemzeti Jogszabálytár njt.jog.gov.hu, időállapot 2026.10.01,
    read 2026-11-27
- id: hu-fee-01
  text: A 7. § (1) hatálya alá tartozó szervezet megfizeti az éves kiberbiztonsági felügyeleti díjat,
    amely legfeljebb a nettó árbevétel 0,015 százaléka és legfeljebb 10 millió forint?
  text_en: Where section 7(1) applies, does the organisation pay the annual cybersecurity supervision
    fee, at most 0.015 percent of net turnover and at most 10 million forint?
  priority: medium
  effort: low
  evidence_hint: Díjfizetés bizonylata, árbevétel-számítás
  remediation: Állapítsa meg a díjat az SZTFH elnökének rendelete szerint, és fizessék meg.
  article: 7. § (1) és (2)
  source_url: https://njt.jog.gov.hu/jogszabaly/2024-69-00-00
  verified: true
  note: Budget organs are excluded. A group cap of 50 million forint is in the same subsection. The payment
    date is in the presidential decree, which was not opened.
  evidence_quote: legfeljebb 0,015 százaléka, de legfeljebb 10 millió forint
  checked_against: 2024. évi LXIX. törvény, Nemzeti Jogszabálytár njt.jog.gov.hu, időállapot 2026.10.01,
    read 2026-11-27
- id: hu-officer-01
  text: Kijelölte a szervezet vezetője az elektronikus információs rendszer biztonságáért felelős személyt,
    és az a személy megfelel a törvényben írt feltételeknek?
  text_en: Has the head of the organisation designated the person responsible for the security of electronic
    information systems, and does that person meet the conditions set in the Act?
  priority: high
  effort: medium
  evidence_hint: Kijelölés, végzettség vagy szakmai gyakorlat igazolása, összeférhetetlenség vizsgálata
  remediation: Jelöljék ki a felelős személyt. A 11. § (3) szerint cselekvőképesnek és büntetlen előéletűnek
    kell lennie; egyes szervezeteknél a miniszteri rendelet szerinti végzettség vagy gyakorlat is kell.
  article: 11. § (1) és (3)
  source_url: https://njt.jog.gov.hu/jogszabaly/2024-69-00-00
  verified: true
  note: 11. § (3) a) requires legal capacity and a clean criminal record. Further qualifications for some
    organisations are in a ministerial decree, which was not opened.
  evidence_quote: kijelöli az elektronikus információs rendszer biztonságáért felelős személyt
  checked_against: 2024. évi LXIX. törvény, Nemzeti Jogszabálytár njt.jog.gov.hu, időállapot 2026.10.01,
    read 2026-11-27
incident_clocks:
  source_url: https://njt.jog.gov.hu/jogszabaly/2024-69-00-00
  verified: true
  evidence_quote: kötelesek haladéktalanul, a kormányrendeletben meghatározottak szerint bejelenteni
  checked_against: 2024. évi LXIX. törvény, Nemzeti Jogszabálytár njt.jog.gov.hu, időállapot 2026.10.01,
    read 2026-11-27
  note: 66. § (1) and (2). The Act does not replace the Directive's 24 hours, 72 hours or one month. The
    hours are left to a government decree, which was not opened. No clock override is applied. Point 40
    bb) adds reputational loss to the significant-incident definition.
deadlines:
- id: hu-register
  description: Nyilvántartásba vétel az SZTFH-nál a működés megkezdésétől vagy a hatályba kerüléstől számított
    30 napon belül.
  description_en: For the organisations in section 8(5), send the registration data to SZTFH within 30
    days of starting operations or coming within the Act.
  relative: 30 days from starting operations or coming into scope
  source_url: https://njt.jog.gov.hu/jogszabaly/2024-69-00-00
  verified: true
  note: 8. § (5). A different 30-day notice to the national cybersecurity authority is 8. § (4) a).
  checked_against: 2024. évi LXIX. törvény, Nemzeti Jogszabálytár njt.jog.gov.hu, időállapot 2026.10.01,
    read 2026-11-27
  evidence_quote: 30 napon belül a 29. § (1) bekezdés a) pontjában meghatározott adatokat megküldeni az
    SZTFH részére
- id: hu-auditor-contract
  description: Szerződés SZTFH-nyilvántartásbeli auditorral a nyilvántartásba vételtől számított 120 napon
    belül, első audit két éven belül.
  description_en: Contract with an SZTFH-registered auditor within 120 days of registration, and the first
    audit within two years.
  relative: 120 days to contract, 2 years to the first audit, from registration
  source_url: https://njt.jog.gov.hu/jogszabaly/2024-69-00-00
  verified: true
  note: 16. § (2). The first audit is within two years of registration. The duty is limited to the organisations
    in 16. § (1).
  checked_against: 2024. évi LXIX. törvény, Nemzeti Jogszabálytár njt.jog.gov.hu, időállapot 2026.10.01,
    read 2026-11-27
  evidence_quote: 120 napon belül a kiberbiztonsági audit elvégzésére megállapodást kötni
notices:
- id: hu-auditor
  text: A kiberbiztonsági auditot az SZTFH nyilvántartásában szereplő auditor végzi. Ennek az eszköznek
    a kimutatása csak előkészítő anyag. Nem audit és nem hivatalos beadvány.
  text_en: An auditor registered with SZTFH must perform the cybersecurity audit. This tool's output is
    preparation material only. It is not the audit and it is not an official filing.
  source_url: https://njt.jog.gov.hu/jogszabaly/2024-69-00-00
  status: ''
  scored: false
