  citation_label: Act LXIX of 2024
  note: 'The Act replaced Act XXIII of 2023 and has been amended since 1 January 2025. The NJT page that was read is the consolidated
    text as presented there (version date shown on the page: 1 October 2026). Every citation is unverified. 63. § (1) says
    the Government operates the national incident-response centre through a body designated by decree. The Act text that was
    read does not itself name Nemzeti Kibervédelmi Intézet (NKI). SZTFH supervises the organisations in 1. § (1) d) and e),
    under 23. § (1) b) as cited on sztfh.hu.'
