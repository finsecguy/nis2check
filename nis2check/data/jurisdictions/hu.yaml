code: hu
language: hu
domain_title: National requirements (HU)
law:
  name: 2024. évi LXIX. törvény Magyarország kiberbiztonságáról
  number: 2024. évi LXIX. törvény
  in_force: '2025-01-01'
  competent_authority: Szabályozott Tevékenységek Felügyeleti Hatósága (SZTFH)
  csirt: nemzeti kiberbiztonsági incidenskezelő központ
  reporting_channel_url: ''
  source_url: https://njt.jog.gov.hu/jogszabaly/2024-69-00-00
  citation_label: Act LXIX of 2024
  note: '82. § (1): the Act enters into force on 1 January 2025, except 120. § (1) on 2 January 2025.
    The page shows the temporal state 2026.10.01. The text was read on njt.jog.gov.hu. https://njt.hu/jogszabaly/2024-69-00-00
    returned curl error 52, Empty reply from server. 1. § (8) names SZTFH. 23. § (1) b) gives SZTFH supervision
    of organisations in 1. § (1) d) and e) that are not under point a). 66. § sends reports to the national
    incident-response centre. The Act prints no URL for that centre, so no reporting-channel URL is stored.
    The SZTFH supervision page returned HTTP 200 and is not stated as the reporting channel. The Act does
    not name Nemzeti Kibervédelmi Intézet.'
entity_terms:
  essential:
    national: alapvető szervezet
    note: 1. § (4). The statutory term is alapvető szervezet.
  important:
    national: fontos szervezet
    note: 1. § (5). The statutory term is fontos szervezet.
