  Art. 2(1):
    ref: art. 5 ust. 1 pkt 1 i ust. 2 pkt 1
    title: Wielkość
    source_url: https://isap.sejm.gov.pl/isap.nsf/download.xsp/WDU20180001560/U/D20181560Lj.pdf
    verified: true
    note: Size uses Annex I to Commission Regulation (EU) No 651/2014, not the 2003 recommendation by name. An Annex
      1 entity that exceeds the medium thresholds is kluczowy. One that meets them, and is not kluczowy, is ważny.
      Art. 5(1)(3) also makes a managed cybersecurity provider that meets the small-enterprise thresholds kluczowy.
      The Directive starts at medium-sized. Art. 5(3) disapplies art. 3(4) of that annex. Art. 5(6) and (7) say
      an entity is not kluczowy or ważny when its information system is independent of its linked or partner enterprises.
    evidence_quote: przewyższa wymogi dla średniego przedsiębiorstwa określone w art. 2 ust. 1 załącznika I
    checked_against: Ustawa z 5 lipca 2018 r., tekst jednolity Kancelarii Sejmu, t.j. Dz.U. z 2026 r. poz. 20, 252,
      815, 1003, 1206, stan 2026-11-09, read 2026-11-27
  Art. 3(1)(a):
