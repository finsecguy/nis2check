code: pl
language: pl
domain_title: National requirements (PL)
law:
  name: Ustawa z dnia 5 lipca 2018 r. o krajowym systemie cyberbezpieczeństwa
  number: Dz.U. 2026 poz. 252 (zmiana); ustawa z 5 lipca 2018 r.
  in_force: '2026-04-03'
  competent_authority: Organy właściwe do spraw cyberbezpieczeństwa, koordynowane przez ministra właściwego do spraw informatyzacji
  csirt: CSIRT NASK, CSIRT GOV, CSIRT MON
  reporting_channel_url: https://www.gov.pl/web/cyfryzacja/nowelizacja-ustawy-o-krajowym-systemie-cyberbezpieczenstwa-ksc---obowiazki-podmiotow-kluczowych-i-waznych
  source_url: https://www.dziennikustaw.gov.pl/D2026000025201.pdf
  citation_label: UKSC
  note: The NIS2 amendment is the Act of 23 January 2026 amending the National Cybersecurity System Act, Journal of Laws 2026,
    item 252 (the Journal PDF and the Sejm ELI text were opened; the item number follows that ELI). The Journal header shows
    publication in Warsaw on 2 March 2026. The Ministry of Digital Affairs says it entered into force on 3 April 2026. A signature
    date of 19 February 2026 was not in the pages that were opened. A consolidated text on isap.sejm.gov.pl was not opened.
    Every citation is unverified. Authorities are per sector; empty cells are not a finding that no authority exists.
