code: pl
language: pl
domain_title: National requirements (PL)
law:
  name: Ustawa z dnia 5 lipca 2018 r. o krajowym systemie cyberbezpieczeństwa
  number: Dz.U. 2018 poz. 1560, t.j. Dz.U. z 2026 r. poz. 20, 252, 815, 1003, 1206
  in_force: '2026-04-03'
  competent_authority: organy właściwe do spraw cyberbezpieczeństwa
  csirt: CSIRT NASK, CSIRT GOV, CSIRT MON
  reporting_channel_url: ''
  source_url: https://isap.sejm.gov.pl/isap.nsf/download.xsp/WDU20180001560/U/D20181560Lj.pdf
  citation_label: UKSC
  note: 'The consolidated text was read from the Sejm PDF dated 2026-11-09, prepared from the uniform text in Journal
    of Laws of 2026, items 20, 252, 815, 1003 and 1206. The amending act of 23 January 2026, Journal of Laws 2026,
    item 252, was published in Warsaw on 2 March 2026. Its art. 49 says it enters into force one month after publication.
    The Ministry of Digital Affairs page of 5 June 2026 states the resulting dates: entry in the list by 3 October
    2026, the new duties by 3 April 2027, and the first audit by 3 April 2028. The date 3 April 2026 is not printed
    as the entry date. Art. 11 sends reports through the system in art. 46. The Act prints no URL, so the ministry
    page is not stored as the reporting channel. Art. 94 of the 2018 Act, with its footnote, is the original entry
    into force and is not the NIS2 amendment. A later request to the same Sejm PDF address on 27 November 2026 returned
    HTTP 200 with an Incapsula HTML challenge of 1150 bytes, not the PDF. The text used here is the PDF of 1227807
    bytes, 179 pages, already downloaded from that address.'
entity_terms:
  essential:
    national: podmiot kluczowy
    note: art. 5 ust. 1. The statutory term is podmiot kluczowy.
  important:
    national: podmiot ważny
    note: art. 5 ust. 2. The statutory term is podmiot ważny.
