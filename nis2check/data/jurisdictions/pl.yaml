national_extras:
- id: pl-register-01
  text: Czy podmiot, który w dniu wejścia w życie nowelizacji spełniał kryteria, złożył wniosek o wpis do wykazu
    w terminie z harmonogramu ministra, który Ministerstwo Cyfryzacji podaje jako 3 października 2026 r., a podmiot,
    który spełnił kryteria później, złożył wniosek w terminie 6 miesięcy?
  text_en: Where the entity met the criteria on the day the amendment entered into force, has it applied for entry
    in the list by the date in the minister's schedule, which the Ministry of Digital Affairs states as 3 October
    2026? Where the entity meets the criteria later, has it applied within 6 months?
  priority: critical
  effort: low
  evidence_hint: Wniosek w systemie teleinformatycznym, numer wpisu w wykazie
  remediation: Złóż wniosek o wpis do wykazu. Ministerstwo podaje, że samoocena i wnioski za okres otwarcia wykazu
    kończyły się 3 października 2026 r.
  article: art. 7c ust. 1 i art. 34 ustawy zmieniającej
  source_url: https://isap.sejm.gov.pl/isap.nsf/download.xsp/WDU20180001560/U/D20181560Lj.pdf
  verified: true
  note: Art. 7c(1) is the six-month rule. For an entity that already met the criteria on entry, art. 33(3) and art.
    34 of the amending act point to a schedule. The ministry page of 5 June 2026 states 3 October 2026. That page
    is not the komunikat in the ministerial journal.
  evidence_quote: składają wniosek o wpis do wykazu, w terminie 6 miesięcy od dnia spełnienia przesłanek
  checked_against: Ustawa z 5 lipca 2018 r., tekst jednolity Kancelarii Sejmu, t.j. Dz.U. z 2026 r. poz. 20, 252,
    815, 1003, 1206, stan 2026-11-09, read 2026-11-27
- id: pl-isms-01
  text: Czy podmiot, który w dniu wejścia w życie nowelizacji spełniał kryteria, wdrożył obowiązki rozdziału 3,
    w tym system zarządzania bezpieczeństwem informacji, do 3 kwietnia 2027 r.?
  text_en: Where the entity met the criteria on the day the amendment entered into force, has it put the chapter
    3 duties in place, including the information security management system, by 3 April 2027?
  priority: critical
  effort: high
  evidence_hint: Polityka SZBI, procedury incydentowe, wykaz ról i osób kontaktowych
  remediation: Wdróż SZBI i dokumentację do 3 kwietnia 2027 r., jeżeli kryteria były spełnione w dniu wejścia ustawy
    w życie.
  article: art. 8 i art. 33 ust. 1 ustawy zmieniającej
  source_url: https://www.gov.pl/web/cyfryzacja/nowelizacja-ustawy-o-krajowym-systemie-cyberbezpieczenstwa-ksc---obowiazki-podmiotow-kluczowych-i-waznych
  verified: true
  note: The amending act art. 33(1) says 12 months from entry into force. The ministry page states the date 3 April
    2027. The first audit of a kluczowy entity is 24 months, and the ministry states 3 April 2028.
  evidence_quote: wdrożenia obowiązków wynikających z nowych przepisów do 3 kwietnia 2027 r.
  checked_against: Ustawa z 5 lipca 2018 r., tekst jednolity Kancelarii Sejmu, t.j. Dz.U. z 2026 r. poz. 20, 252,
    815, 1003, 1206, stan 2026-11-09, read 2026-11-27
- id: pl-incident-01
  text: Czy obsługa incydentu poważnego przewiduje wczesne ostrzeżenie w 24 godziny, zgłoszenie w 72 godziny i sprawozdanie
    końcowe w ciągu miesiąca do CSIRT sektorowego, z wyjątkiem podmiotu ważnego będącego podmiotem publicznym, który
    nie przekazuje wczesnego ostrzeżenia, sprawozdania okresowego, sprawozdania z postępu i sprawozdania końcowego?
  text_en: Does serious-incident handling provide an early warning within 24 hours, a notification within 72 hours
    and a final report within one month to the sector CSIRT, except that an important public entity does not send
    the early warning, the interim report, the progress report or the final report?
  priority: high
  effort: medium
  evidence_hint: Procedura zgłaszania, wskazanie właściwego CSIRT sektorowego
  remediation: Zaktualizuj procedurę zgłaszania incydentu poważnego i wskaż właściwy CSIRT.
  article: art. 11 ust. 1 i art. 12c
  source_url: https://isap.sejm.gov.pl/isap.nsf/download.xsp/WDU20180001560/U/D20181560Lj.pdf
  verified: true
  note: Art. 12c is the exception for an important public entity.
  evidence_quote: zgłasza wczesne ostrzeżenie o incydencie poważnym niezwłocznie, niepóźniej niż w ciągu 24 godzin
  checked_against: Ustawa z 5 lipca 2018 r., tekst jednolity Kancelarii Sejmu, t.j. Dz.U. z 2026 r. poz. 20, 252,
    815, 1003, 1206, stan 2026-11-09, read 2026-11-27
incident_clocks:
  source_url: https://isap.sejm.gov.pl/isap.nsf/download.xsp/WDU20180001560/U/D20181560Lj.pdf
  verified: true
  evidence_quote: niepóźniej niż w ciągu 24 godzin od momentu jego wykrycia
  checked_against: Ustawa z 5 lipca 2018 r., tekst jednolity Kancelarii Sejmu, t.j. Dz.U. z 2026 r. poz. 20, 252,
    815, 1003, 1206, stan 2026-11-09, read 2026-11-27
  note: Art. 11(1) points 4, 4a and 4c match 24 hours, 72 hours and one month. No override is applied. Art. 12c
    removes the early warning and the later reports for an important public entity.
deadlines:
- id: pl-isms
  description: System zarządzania bezpieczeństwem informacji i związane z nim obowiązki do 3 kwietnia 2027 r. dla
    podmiotów, które 3 kwietnia 2026 r. spełniały kryteria.
  description_en: Chapter 3 duties, including the information security management system, by 3 April 2027 for an
    entity that met the criteria on the day the amendment entered into force.
  date: '2027-04-03'
  source_url: https://www.gov.pl/web/cyfryzacja/nowelizacja-ustawy-o-krajowym-systemie-cyberbezpieczenstwa-ksc---obowiazki-podmiotow-kluczowych-i-waznych
  verified: true
  note: Ministry page of 5 June 2026. The amending act art. 33(1) says 12 months from entry into force and does
    not print 3 April 2027.
  checked_against: Ustawa z 5 lipca 2018 r., tekst jednolity Kancelarii Sejmu, t.j. Dz.U. z 2026 r. poz. 20, 252,
    815, 1003, 1206, stan 2026-11-09, read 2026-11-27
  evidence_quote: wdrożenia obowiązków wynikających z nowych przepisów do 3 kwietnia 2027 r.
- id: pl-later-entry
  description: Podmiot, który później spełni kryteria, uzupełnia obowiązki rejestracyjne. Sześciomiesięczny termin
    pojawia się w nowelizacji przy wezwaniu do uzupełnienia danych; ogólna reguła sześciu miesięcy od spełnienia
    kryteriów nie została przypisana do jednego artykułu.
  description_en: An entity applies for entry in the list within 6 months of meeting the criteria. An entity that
    already met them on the day the amendment entered into force follows the minister's schedule.
  relative: see the note; no single article was confirmed
  source_url: https://isap.sejm.gov.pl/isap.nsf/download.xsp/WDU20180001560/U/D20181560Lj.pdf
  verified: true
  note: Art. 7c(1). The transitional schedule is art. 34 of the amending act. The ministry page states 3 October
    2026 for that entry.
  checked_against: Ustawa z 5 lipca 2018 r., tekst jednolity Kancelarii Sejmu, t.j. Dz.U. z 2026 r. poz. 20, 252,
    815, 1003, 1206, stan 2026-11-09, read 2026-11-27
  evidence_quote: w terminie 6 miesięcy od dnia spełnienia przesłanek uznania za podmiot kluczowy lub podmiot ważny
notices:
- id: pl-fines
  text: Kary pieniężne, o których mowa w art. 73 ust. 1-4 oraz art. 73a-73c i art. 76b, mogą być po raz pierwszy
    nałożone po upływie 2 lat od dnia wejścia w życie ustawy zmieniającej. Ten punkt nie jest oceniany.
  text_en: The administrative fines in art. 73(1) to (4), art. 73a to 73c and art. 76b may be imposed for the first
    time only after two years from the entry into force of the amending act. This item is not scored.
  source_url: https://www.dziennikustaw.gov.pl/D2026000025201.pdf
  status: ''
  scored: false
