national_extras:
- id: pl-register-01
  text: Czy podmiot złożył wniosek o wpis do wykazu podmiotów kluczowych i ważnych?
  text_en: Has the entity applied for entry in the list of essential and important entities (wykaz)?
  priority: critical
  effort: low
  evidence_hint: Wniosek w systemie teleinformatycznym, numer wpisu w wykazie
  remediation: Złóż wniosek o wpis do wykazu. Ministerstwo podaje, że samoocena i wnioski za okres otwarcia wykazu kończyły
    się 3 października 2026 r.
  article: art. 7
  source_url: https://www.gov.pl/web/baza-wiedzy/nowelizacja-ustawy-o-krajowym-systemie-cyberbezpieczenstwa
  verified: false
  note: 'art. 7 creates the wykaz, on the amending act that was opened. The ministry page says entities that met the criteria
    had to file after a self-assessment by 3 October 2026, through system S46. The opening date 13 April 2026 and the self-registration
    window starting 7 May 2026 were not on the ministry extract that was read, so they are not stated as sourced. Later entrants:
    a six-month period appears in the amendment for completing data after a call, but a general ''six months from meeting
    the criteria'' rule was not pinned to one article. Unverified.'
- id: pl-isms-01
  text: Czy podmiot ma system zarządzania bezpieczeństwem informacji, dokumentację, procedury incydentów, struktury cyberbezpieczeństwa
    i osoby kontaktowe, w terminie do 3 kwietnia 2027 r. dla podmiotów, które 3 kwietnia 2026 r. spełniały kryteria?
  text_en: Does the entity have an information security management system, the documentation, incident procedures, cybersecurity
    structures and contact persons, by 3 April 2027 where it already met the criteria on 3 April 2026?
  priority: critical
  effort: high
  evidence_hint: Polityka SZBI, procedury incydentowe, wykaz ról i osób kontaktowych
  remediation: Wdróż SZBI i dokumentację do 3 kwietnia 2027 r., jeżeli kryteria były spełnione w dniu wejścia ustawy w życie.
  article: ''
  source_url: https://www.gov.pl/web/baza-wiedzy/nowelizacja-ustawy-o-krajowym-systemie-cyberbezpieczenstwa
  verified: false
  note: The ministry page states 12 months, until 3 April 2027, for the information-security management duties of entities
    that met the criteria on 3 April 2026. The amending act that was opened says chapter 3 duties are performed within 12
    months in a transitional rule, but that article number was not pinned. Unverified.
- id: pl-incident-01
  text: Czy proces zgłaszania incydentu poważnego został dostosowany do nowych terminów (wczesne ostrzeżenie do 24 godzin,
    zgłoszenie do 72 godzin, sprawozdanie końcowe w ciągu miesiąca)?
  text_en: Has the serious-incident reporting process been adapted to the new clocks (early warning within 24 hours, notification
    within 72 hours, final report within one month)?
  priority: high
  effort: medium
  evidence_hint: Procedura zgłaszania, wskazanie właściwego CSIRT sektorowego
  remediation: Zaktualizuj procedurę zgłaszania incydentu poważnego i wskaż właściwy CSIRT.
  article: art. 11
  source_url: https://www.dziennikustaw.gov.pl/D2026000025201.pdf
  verified: false
  note: art. 11 of the amendment, as read, sets 24 hours, 72 hours and one month, so the clocks are not overridden. A separate
    six-month deadline, counted from entry into force, for adapting the process was not pinned to an article in the text that
    was indexed. The question records the clocks. It does not score a date that was not sourced. Unverified.
incident_clocks:
  source_url: https://www.dziennikustaw.gov.pl/D2026000025201.pdf
  verified: false
  note: 'The amendment''s art. 11, as read, matches the Directive: early warning within 24 hours, notification within 72 hours,
    final report within one month, sent to the sector CSIRT. A trust service provider notifies within 24 hours. No override
    is applied.'
deadlines:
- id: pl-isms
  description: System zarządzania bezpieczeństwem informacji i związane z nim obowiązki do 3 kwietnia 2027 r. dla podmiotów,
    które 3 kwietnia 2026 r. spełniały kryteria.
  description_en: Information security management system and the related duties by 3 April 2027, for entities that met the
    criteria on 3 April 2026.
  date: '2027-04-03'
  source_url: https://www.gov.pl/web/baza-wiedzy/nowelizacja-ustawy-o-krajowym-systemie-cyberbezpieczenstwa
  verified: false
  note: Ministry of Digital Affairs. Twelve months from 3 April 2026.
- id: pl-later-entry
  description: Podmiot, który później spełni kryteria, uzupełnia obowiązki rejestracyjne. Sześciomiesięczny termin pojawia
    się w nowelizacji przy wezwaniu do uzupełnienia danych; ogólna reguła sześciu miesięcy od spełnienia kryteriów nie została
    przypisana do jednego artykułu.
  description_en: An entity that meets the criteria later completes the registration duties. A six-month period appears in
    the amendment where the authority calls for missing data. A general rule of six months from meeting the criteria was not
    pinned to one article.
  relative: see the note; no single article was confirmed
  source_url: https://www.dziennikustaw.gov.pl/D2026000025201.pdf
  verified: false
  note: Left as a relative rule without a calendar date.
notices:
- id: pl-fines
  text: Kary administracyjne za część obowiązków mają, według opisu wdrożenia, być stosowane dopiero dwa lata po wejściu nowelizacji
    w życie. To jest nota, a nie pytanie i nie wchodzi do wyniku.
  text_en: Administrative fines for some obligations are described as applying only two years after the amendment entered
    into force. This is a note. It is not a question and it is not scored.
  source_url: https://www.gov.pl/web/cyfryzacja/nowelizacja-ustawy-o-krajowym-systemie-cyberbezpieczenstwa-ksc---obowiazki-podmiotow-kluczowych-i-waznych
  status: ''
  scored: false
- id: pl-vendors
  text: 'Przepisy o dostawcach wysokiego ryzyka zostały skierowane do Trybunału Konstytucyjnego. Status: w toku. Ten punkt
    nie jest oceniany.'
  text_en: 'The rules on high-risk vendors were referred to the Constitutional Tribunal. Status: under review. This item is
    not scored.'
  source_url: https://www.gov.pl/web/cyfryzacja/nowelizacja-ustawy-o-krajowym-systemie-cyberbezpieczenstwa-ksc---obowiazki-podmiotow-kluczowych-i-waznych
  status: under_review
  scored: false
