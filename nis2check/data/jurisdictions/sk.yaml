code: sk
language: sk
domain_title: National requirements (SK)
law:
  name: Zákon č. 69/2018 Z. z. o kybernetickej bezpečnosti a o zmene a doplnení niektorých zákonov
  number: 69/2018 Z. z.
  in_force: '2025-01-01'
  competent_authority: Národný bezpečnostný úrad (NBÚ)
  csirt: SK-CERT
  reporting_channel_url: https://jiskb.nbu.gov.sk/
  source_url: https://www.slov-lex.sk/ezbierky/pravne-predpisy/SK/ZZ/2018/69/20260430
  citation_label: Act 69/2018
  note: NIS2 was transposed by Act No. 366/2024 Z. z., in force on 1 January 2025. The consolidated text read for these citations
    is the Slov-Lex version in force from 30 April 2026 (later amendments 318/2025 Z. z. and 67/2026 Z. z.). The Act does
    not use the terms kľúčový subjekt and dôležitý subjekt.
entity_terms:
  essential:
    national: prevádzkovateľ kritickej základnej služby
    note: § 18. This is the higher tier. It is not the phrase kľúčový subjekt.
  important:
    national: prevádzkovateľ základnej služby
    note: § 17. An operator who does not run a critical essential service is the closer match to an important entity. The
      Act does not use dôležitý subjekt.
