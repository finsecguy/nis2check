national_extras:
- id: sk-reg-01
  text: Oznámila organizácia úradu do 60 dní od začatia činnosti, že vykonáva činnosť podľa § 17 ods. 1, a je zapísaná v registri
    prevádzkovateľov základnej služby?
  text_en: Has the organisation notified the authority within 60 days of starting the activity under section 17(1), and is
    it entered in the register of operators of an essential service?
  priority: critical
  effort: low
  evidence_hint: Podanie v jednotnom informačnom systéme, oznam o zápise do registra
  remediation: Podajte oznámenie úradu cez jednotný informačný systém kybernetickej bezpečnosti a uložte oznam o zápise.
  article: § 17 ods. 2
  source_url: https://www.slov-lex.sk/ezbierky/pravne-predpisy/SK/ZZ/2018/69/20260430
  verified: true
  note: ''
- id: sk-mkb-01
  text: Je určený manažér kybernetickej bezpečnosti, ktorý je pri návrhu a presadzovaní bezpečnostných opatrení nezávislý
    od riadenia prevádzky a vývoja služieb informačných technológií a spĺňa znalostné štandardy pre túto rolu?
  text_en: Has a cybersecurity manager been designated who is independent of IT operations and development when measures are
    adopted, and who meets the knowledge standards for that role?
  priority: critical
  effort: medium
  evidence_hint: Menovací dekrét, opis roly, doklad o splnení znalostných štandardov
  remediation: Určte manažéra kybernetickej bezpečnosti a doložte, že spĺňa znalostné štandardy.
  article: § 20 ods. 4 písm. a)
  source_url: https://www.slov-lex.sk/ezbierky/pravne-predpisy/SK/ZZ/2018/69/20260430
  verified: true
  note: The Act requires knowledge standards, not a named certificate. Decree No. 492/2022 Z. z. sets those standards; the
    decree text was not read paragraph by paragraph.
- id: sk-audit-01
  text: Je dohodnuté, či sa účinnosť opatrení preverí auditom, alebo, ak organizácia nie je prevádzkovateľom kritickej základnej
    služby, samohodnotením, a je známy termín (audit do dvoch rokov od zápisu do registra, pri samohodnotení audit najneskôr
    do piatich rokov)?
  text_en: Has the organisation chosen a cybersecurity audit or, where it is not an operator of a critical essential service,
    a self-assessment, and is the deadline recorded (an audit within two years of registration, and for a self-assessment
    an audit within five years at the latest)?
  priority: high
  effort: medium
  evidence_hint: Plán auditu alebo záznam o samohodnotení v jednotnom informačnom systéme, termín ďalšieho auditu
  remediation: Zapíšte voľbu auditu alebo samohodnotenia a termín. Samohodnotenie vykonáva manažér kybernetickej bezpečnosti.
  article: § 29 ods. 1 a ods. 8
  source_url: https://www.slov-lex.sk/ezbierky/pravne-predpisy/SK/ZZ/2018/69/20260430
  verified: true
  note: The periodicity of later audits is set by a decree under § 32 ods. 1 písm. d). That decree interval was not read.
- id: sk-report-01
  text: Hlási organizácia závažný kybernetický bezpečnostný incident cez jednotný informačný systém kybernetickej bezpečnosti?
  text_en: Does the organisation report a significant cybersecurity incident through the unified cybersecurity information
    system?
  priority: critical
  effort: low
  evidence_hint: Postup hlásenia, prístup do JISKB, kontakt na SK-CERT
  remediation: Nastavte hlásenie v JISKB. Verejný formulár SK-CERT nenahrádza zákonné hlásenie prevádzkovateľa základnej služby.
  article: § 24 ods. 3
  source_url: https://www.slov-lex.sk/ezbierky/pravne-predpisy/SK/ZZ/2018/69/20260430
  verified: true
  note: 'SK-CERT states that only a report through JISKB meets the statutory duty. Channel: https://jiskb.nbu.gov.sk/'
incident_clocks:
  further_days: 30
  source_url: https://www.slov-lex.sk/ezbierky/pravne-predpisy/SK/ZZ/2018/69/20260430
  verified: true
  note: '§ 24 ods. 3 keeps the Directive clocks: early warning within 24 hours, notification within 72 hours (24 hours for
    a trust service provider), final report within one month of the notification. § 24 ods. 3 písm. e) sets the updated final
    report at 30 days, which is the only override.'
deadlines:
- id: sk-notify
  description: Oznámenie úradu do 60 dní od začatia činnosti podľa § 17 ods. 1.
  description_en: Notify the authority within 60 days of starting an activity under section 17(1).
  relative: 60 days from the start of the activity
  source_url: https://www.slov-lex.sk/ezbierky/pravne-predpisy/SK/ZZ/2018/69/20260430
  verified: true
  note: § 17 ods. 2.
- id: sk-measures
  description: Bezpečnostné opatrenia najneskôr do 12 mesiacov od zápisu do registra.
  description_en: Security measures within 12 months of entry in the register.
  relative: 12 months from entry in the register
  source_url: https://www.slov-lex.sk/ezbierky/pravne-predpisy/SK/ZZ/2018/69/20260430
  verified: true
  note: § 19 ods. 1.
- id: sk-audit
  description: Audit do dvoch rokov od zápisu do registra. Prevádzkovateľ, ktorý nie je prevádzkovateľom kritickej základnej
    služby, môže medzitým použiť samohodnotenie a auditu sa podrobí do piatich rokov.
  description_en: An audit within two years of registration. An operator who is not an operator of a critical essential service
    may self-assess until then and must be audited within five years.
  relative: 2 years from registration, or 5 years where self-assessment is used
  source_url: https://www.slov-lex.sk/ezbierky/pravne-predpisy/SK/ZZ/2018/69/20260430
  verified: true
  note: § 29 ods. 1 a ods. 8.
notices: []
