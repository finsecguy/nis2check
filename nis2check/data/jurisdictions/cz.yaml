national_extras:
- id: cz-reg-01
  text: Ohlásil poskytovatel služby splňující podmínky podle § 4 odst. 1 tuto službu Úřadu nejpozději
    do 60 dnů ode dne, kdy ke splnění podmínek došlo?
  text_en: Has a provider who meets the conditions in section 4(1) notified that service to the Office
    within 60 days of meeting them?
  priority: critical
  effort: low
  evidence_hint: Podání na Portálu NÚKIB, rozhodnutí o registraci
  remediation: Podejte ohlášení na Portálu NÚKIB a uložte rozhodnutí o registraci.
  article: § 6 odst. 1
  source_url: https://opendata.eselpoint.gov.cz/esel-esb/eli/cz/sb/2025/264/2025-11-01
  verified: true
  note: '§ 6 odst. 3: a section 5 registration is started by the Office, not by this 60-day notice.'
  checked_against: Zákon č. 264/2025 Sb., znění účinné od 1. 11. 2025, e-Sbírka open data, read 2026-11-23
  evidence_quote: povinen ohlásit tuto službu Úřadu nejpozději do 60 dnů ode dne, kdy ke splnění podmínek
    došlo
- id: cz-measures-01
  text: 'Zavádí organizace bezpečnostní opatření podle vyhlášky pro svůj režim (vyšší režim: vyhláška
    č. 409/2025 Sb., nižší režim: vyhláška č. 410/2025 Sb.)?'
  text_en: 'Does the organisation apply the security measures in the decree for its regime (higher regime:
    Decree No. 409/2025 Coll., lower regime: Decree No. 410/2025 Coll.)?'
  priority: critical
  effort: high
  evidence_hint: Rozhodnutí o režimu, přehled opatření podle příslušné vyhlášky
  remediation: Zjistěte režim a veďte opatření podle vyhlášky, která se na něj vztahuje. Lhůta k zavedení
    je podle průvodce NÚKIB jeden rok od doručení rozhodnutí o registraci.
  article: § 13 odst. 4 a § 15 odst. 4
  source_url: https://opendata.eselpoint.gov.cz/esel-esb/eli/cz/sb/2025/264/2025-11-01
  verified: true
  note: § 13 odst. 4 for measures and § 15 odst. 4 for incident reporting. Decree numbers are not stated
    because the decrees were not opened.
  checked_against: Zákon č. 264/2025 Sb., znění účinné od 1. 11. 2025, e-Sbírka open data, read 2026-11-23
  evidence_quote: nejpozději do 1 roku ode dne doručení rozhodnutí o registraci regulované služby
- id: cz-manager-01
  text: Stanovil poskytovatel v režimu vyšších povinností bezpečnostní role?
  text_en: Has a higher-regime provider determined the security roles?
  priority: high
  effort: medium
  evidence_hint: Jmenování, doklad o praxi a školení
  remediation: Stanovte bezpečnostní role podle § 14 odst. 1 písm. a) bodu 3.
  article: § 14 odst. 1 písm. a) bod 3
  source_url: https://opendata.eselpoint.gov.cz/esel-esb/eli/cz/sb/2025/264/2025-11-01
  verified: true
  note: The three-year practice and decree No. 409/2025 Sb. were not in § 14. That practice claim is removed.
  checked_against: Zákon č. 264/2025 Sb., znění účinné od 1. 11. 2025, e-Sbírka open data, read 2026-11-23
  evidence_quote: stanovení bezpečnostních rolí
incident_clocks:
  final_days: 30
  further_days: 30
  source_url: https://opendata.eselpoint.gov.cz/esel-esb/eli/cz/sb/2025/264/2025-11-01
  verified: true
  evidence_quote: nejpozději do 30 dnů ode dne předložení oznámení podle písmene a) závěrečnou zprávu
  checked_against: Zákon č. 264/2025 Sb., znění účinné od 1. 11. 2025, e-Sbírka open data, read 2026-11-23
  note: § 16 odst. 3 písm. c). The 72-hour notice and the 30-day final report apply when the incident
    has a significant impact. If it is still ongoing, a progress report follows the deadline and a final
    report is due within 30 days of resolution. The 24-hour initial report in § 16 odst. 1 is wider.
