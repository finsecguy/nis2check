  source_url: https://www.e-sbirka.cz/sb/2025/264
  citation_label: Act 264/2025 Coll.
  note: 'Act number and the 1 November 2025 in-force date are stated by the Ministry of Foreign Affairs (mzv.gov.cz) and by
    NÚKIB. The Collection entry is částka 264/2025 Sb., published 4 August 2025. e-Sbírka did not return the consolidated
    wording in this session (the public site is a script shell), so every paragraph below is unverified. The CSIRT split is
    the secondary reading of § 15: the higher regime reports to the Authority and the lower regime to Národní CERT.'
