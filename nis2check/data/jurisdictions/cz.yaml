code: cz
language: cs
domain_title: National requirements (CZ)
law:
  name: Zákon č. 264/2025 Sb., o kybernetické bezpečnosti
  number: 264/2025 Sb.
  in_force: '2025-11-01'
  competent_authority: Národní úřad pro kybernetickou a informační bezpečnost (NÚKIB)
  csirt: Úřad (vyšší režim); Národní CERT (nižší režim)
  reporting_channel_url: https://portal.nukib.gov.cz/
  source_url: https://opendata.eselpoint.gov.cz/esel-esb/eli/cz/sb/2025/264/2025-11-01
  citation_label: Act 264/2025 Coll.
  note: § 1 odst. 1 names Národní úřad pro kybernetickou a informační bezpečnost as the Úřad. The open-data
    version is the consolidated wording effective 1 November 2025. Sectors are listed in § 4 odst. 1 písm.
    a). The service list inside each sector is in a decree the Act requires; that decree was not opened,
    so its number is not stated here.
entity_terms:
  essential:
    national: poskytovatel regulované služby v režimu vyšších povinností
    note: § 8 odst. 1, first sentence. The Act uses režim vyšších povinností.
  important:
    national: poskytovatel regulované služby v režimu nižších povinností
    note: § 8 odst. 1, second sentence. The Act uses režim nižších povinností.
