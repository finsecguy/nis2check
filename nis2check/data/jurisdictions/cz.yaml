national_extras:
- id: cz-reg-01
  text: Ohlásila organizace regulovanou službu NÚKIB ve lhůtě 60 dnů ode dne, kdy splnila podmínky pro registraci?
  text_en: Has the organisation notified the regulated service to NÚKIB within 60 days of meeting the conditions for registration?
  priority: critical
  effort: low
  evidence_hint: Podání na Portálu NÚKIB, rozhodnutí o registraci
  remediation: Podejte ohlášení na Portálu NÚKIB a uložte rozhodnutí o registraci.
  article: § 6 odst. 1
  source_url: https://portal.nukib.gov.cz/informacni-servis/podpurne-materialy/69d8ccc9af66639c2b0c3843
  verified: false
  note: NÚKIB's own guide cites § 6 and the 60-day period. The consolidated statute text was not opened.
- id: cz-measures-01
  text: 'Zavádí organizace bezpečnostní opatření podle vyhlášky pro svůj režim (vyšší režim: vyhláška č. 409/2025 Sb., nižší
    režim: vyhláška č. 410/2025 Sb.)?'
  text_en: 'Does the organisation apply the security measures in the decree for its regime (higher regime: Decree No. 409/2025
    Coll., lower regime: Decree No. 410/2025 Coll.)?'
  priority: critical
  effort: high
  evidence_hint: Rozhodnutí o režimu, přehled opatření podle příslušné vyhlášky
  remediation: Zjistěte režim a veďte opatření podle vyhlášky, která se na něj vztahuje. Lhůta k zavedení je podle průvodce
    NÚKIB jeden rok od doručení rozhodnutí o registraci.
  article: § 13 a § 14
  source_url: https://portal.nukib.gov.cz/pruvodce-novym-zakonem-o-kyberneticke-bezpecnosti
  verified: false
  note: Decree numbers are those published by NÚKIB. The decree texts were not opened, and § 13 and § 14 were not confirmed
    in e-Sbírka.
- id: cz-manager-01
  text: Má organizace v režimu vyšších povinností manažera kybernetické bezpečnosti, který je pro tuto roli vyškolen a má
    nejméně tříletou praxi s řízením kybernetické bezpečnosti nebo bezpečnosti informací?
  text_en: If the organisation is in the higher regime, does it have a cybersecurity manager who is trained for the role and
    has at least three years of practice managing cybersecurity or information security?
  priority: high
  effort: medium
  evidence_hint: Jmenování, doklad o praxi a školení
  remediation: Jmenujte manažera kybernetické bezpečnosti a uložte doklad o praxi. Podle NÚKIB vyhláška č. 409/2025 Sb. bližší
    požadavky nestanoví.
  article: ''
  source_url: https://portal.nukib.gov.cz/manazer-kyberneticke-bezpecnosti
  verified: false
  note: The role and the three-year practice are described on the NÚKIB portal. No statute paragraph number is given here
    because the consolidated Act was not opened and the portal page that was read did not cite one.
incident_clocks:
  source_url: https://portal.nukib.gov.cz/informacni-servis/podpurne-materialy/68f623fab8929270020d7f68
  verified: false
  note: Clocks stay at the Directive's 24 hours, 72 hours and one month. The article map for Art. 23 records a confirmed 30-day
    final report, but this clock field is left unverified and is not applied. NÚKIB says every incident is reported first through
    Portál NÚKIB, and that the reporting duty starts at the latest one year after the registration decision is delivered.
