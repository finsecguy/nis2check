# NIS2 control catalogue
#
# Source: Directive (EU) 2022/2555 (NIS2), Articles 20, 21(2) and 23.
# Each domain maps to one legal requirement. Each question is a practical
# check an SME can answer with yes / partial / no / na and back with evidence.
#
# priority: critical (weight 3), high (weight 2), medium (weight 1). This is the
#   regulatory baseline weight.
# effort: low | medium | high. An estimate of implementation effort for an SME.
# attack_mitigations: MITRE ATT&CK Enterprise mitigation IDs this control implements.
#   Links to threat patterns are derived from ATT&CK "mitigates" relationships.
# threat_patterns: extra links to patterns that ATT&CK does not cover
#   (error, misuse, physical) or where the link is direct (supply chain).

version: "1.1"
source: "Directive (EU) 2022/2555 (NIS2)"

domains:
  - id: GOV
    article: "Art. 20"
    verified: true
    checked_against: "Directive (EU) 2022/2555, OJ L 333, 27.12.2022, p. 80, English edition, read 2026-11-23"
    evidence_quote: "the management bodies of essential and important entities approve the cybersecurity risk-management measures taken by those entities in order to comply with Article 21, oversee its implementation"
    title: "Governance and management accountability"
    summary: >
      Management bodies must approve the cybersecurity risk-management
      measures, oversee their implementation, can be held liable for
      infringements, and must follow cybersecurity training.
    questions:
      - id: GOV-01
        text: "Has the management body approved the cybersecurity risk-management measures taken in order to comply with Article 21?"
        verified: true
        checked_against: "Directive (EU) 2022/2555, OJ L 333, 27.12.2022, p. 80, English edition, read 2026-11-23"
        evidence_quote: "approve the cybersecurity risk-management measures taken by those entities in order to comply with Article 21"
        priority: critical
        effort: low
        evidence_hint: "Board or management meeting minutes, signed policy approval"
        remediation: "Present the security policy set to management and record formal approval in minutes."
      - id: GOV-02
        text: "Does the management body oversee the implementation of those cybersecurity risk-management measures?"
        verified: true
        checked_against: "Directive (EU) 2022/2555, OJ L 333, 27.12.2022, p. 80, English edition, read 2026-11-23"
        evidence_quote: "oversee its implementation"
        priority: high
        effort: low
        evidence_hint: "Quarterly security report, risk dashboard, meeting agendas"
        remediation: "Record how the management body oversees implementation of the measures."
      - id: GOV-03
        text: "Are members of the management body required to follow training, and do they follow it, so that they gain sufficient knowledge and skills to identify risks and assess cybersecurity risk-management practices and their impact on the services provided?"
        verified: true
        checked_against: "Directive (EU) 2022/2555, OJ L 333, 27.12.2022, p. 80, English edition, read 2026-11-23"
        evidence_quote: "members of the management bodies of essential and important entities are required to follow training"
        priority: high
        effort: low
        attack_mitigations: [M1017]
        evidence_hint: "Training certificates or attendance records for each manager"
        remediation: "Book cybersecurity awareness training for all management body members and keep attendance records."
      - id: GOV-04
        text: "Can the management body be held liable for infringements of Article 21, without prejudice to national law on the liability of public institutions, public servants and elected or appointed officials?"
        verified: true
        checked_against: "Directive (EU) 2022/2555, OJ L 333, 27.12.2022, p. 80, English edition, read 2026-11-23"
        evidence_quote: "can be held liable for infringements by the entities of that Article"
        priority: medium
        effort: low
        evidence_hint: "Org chart, role description, appointment letter"
        remediation: "Record the basis on which the management body can be held liable for an infringement of Article 21, including any national rule on public bodies."

