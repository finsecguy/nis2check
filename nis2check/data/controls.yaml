  - id: REP
    article: "Art. 23"
    verified: true
    checked_against: "Directive (EU) 2022/2555, OJ L 333, 27.12.2022, p. 80, English edition, read 2026-11-23"
    evidence_quote: "within 24 hours of becoming aware of the significant incident, an early warning"
    title: "Incident reporting obligations"
    summary: >
      A significant incident is notified to the CSIRT or, where applicable, the
      competent authority. An early warning is due within 24 hours of becoming
      aware, an incident notification within 72 hours of becoming aware, and a
      final report not later than one month after that notification was submitted.
      An intermediate report is due on request. If the incident is still ongoing
      when the final report is submitted, a progress report is due then and a
      further final report within one month of handling the incident.
