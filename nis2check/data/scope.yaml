# Indicative NIS2 scope rules.
#
# Verified against the Official Journal text of Directive (EU) 2022/2555
# (OJ L 333, 27.12.2022, p. 80), Articles 2 and 3 and Annexes I and II, and
# against Commission Recommendation 2003/361/EC (OJ L 124, 20.5.2003, p. 36),
# Annex, Article 2.
#
# Article 2(1) applies the directive to Annex I and II entities that qualify as
# medium-sized enterprises under Article 2 of the Recommendation's Annex, or
# that exceed the ceilings for medium-sized enterprises. Article 2(1), second
# sentence, disapplies Article 3(4) of that Annex, so ownership by a public
# body does not by itself take an entity outside the size test.
#
# "Above" on a financial ceiling means strictly greater than the figure in the
# Recommendation. "Not exceeding EUR 10 million" is still at or under the ceiling.
#
# This is not legal advice. National transposition and a designation by the
# competent authority can reach a different result.

version: "1"
source: "Directive (EU) 2022/2555 (OJ L 333, 27.12.2022, p. 80)"
recommendation: "Commission Recommendation 2003/361/EC (OJ L 124, 20.5.2003, p. 36)"

disclaimer: >
  National transposition can differ, and a competent authority can register
  an entity as essential or important, or leave it outside the size-cap rule.
  This screen is an indicative reading of the directive and Recommendation
  2003/361/EC. It is not legal advice.

# Recommendation 2003/361/EC, Annex, Article 2. An entity meets a band when
# the staff figure is reached OR both financial ceilings are passed.
size:
  verified: true
  checked_against: "Commission Recommendation 2003/361/EC, OJ L 124, 20.5.2003, p. 36, Annex Article 2, read 2026-11-23"
  evidence_quote: "enterprises which employ fewer than 250 persons and which have an annual turnover not exceeding EUR 50 million, and/or an annual balance sheet total not exceeding EUR 43 million"
  # Large: 250 or more employees, or turnover above EUR 50 million AND
  # balance sheet above EUR 43 million. Recommendation, Annex, Art. 2(1):
  # an SME employs fewer than 250 persons and has turnover not exceeding
  # EUR 50 million and/or a balance sheet not exceeding EUR 43 million.
  large:
    employees_at_least: 250
    turnover_eur_above: 50000000
    balance_sheet_eur_above: 43000000
  # Medium: 50 or more employees, or turnover above EUR 10 million AND
  # balance sheet above EUR 10 million. Recommendation, Annex, Art. 2(2):
  # a small enterprise employs fewer than 50 persons and its turnover and/or
  # balance sheet does not exceed EUR 10 million.
  medium:
    employees_at_least: 50
    turnover_eur_above: 10000000
    balance_sheet_eur_above: 10000000
  # Below this, the entity is a microenterprise. Recommendation, Annex,
  # Art. 2(3): fewer than 10 persons and turnover and/or balance sheet not
  # exceeding EUR 2 million. Micro and small are both under the NIS2 size-cap.
  micro:
    employees_at_least: 10
    turnover_eur_above: 2000000
    balance_sheet_eur_above: 2000000

size_notes:
  - >
    Headcount in the Recommendation is annual work units, not a raw
    headcount (Annex, Art. 5).     Crossing a ceiling changes the category only
    after two consecutive accounting periods (Art. 4(2)). Partner and linked
    enterprises are counted in under Art. 6(2). Member States can take account
    of how independent the entity is from its partner or linked enterprises in
    terms of the network and information systems it uses and the services it
    provides (NIS2 recital 16).
  - >
    NIS2 Art. 2(1) disapplies Art. 3(4) of the Recommendation's Annex, so
    control by a public body does not by itself decide the size category.

# effect:
#   essential_any_size       in scope at any size, essential (Art. 3(1))
#   important_any_size       in scope at any size, important unless a stronger rule applies
#   important_if_annex       in scope at any size only when the entity is an Annex I or II type
#   telecom                  in scope at any size; essential only when medium or large
#   local_public_admin       not in scope unless the Member State extends the directive
special_cases:
  - id: dns_provider
    label: "DNS service provider, other than an operator of a root name server"
    articles: ["Art. 2(2)(a)(iii)", "Art. 3(1)(b)", "Annex I, point 8"]
    effect: essential_any_size
    verified: true
    checked_against: "Directive (EU) 2022/2555, OJ L 333, 27.12.2022, p. 80, English edition, read 2026-11-23"
    evidence_quote: "DNS service providers, regardless of their size"
    organisation_sector: digital_infrastructure
    reason: >
      DNS service providers are in scope regardless of size and are essential
      entities. Operators of root name servers are not in this category.

  - id: tld_registry
    label: "Top-level domain name registry"
    articles: ["Art. 2(2)(a)(iii)", "Art. 3(1)(b)", "Annex I, point 8"]
    effect: essential_any_size
    verified: true
    checked_against: "Directive (EU) 2022/2555, OJ L 333, 27.12.2022, p. 80, English edition, read 2026-11-23"
    evidence_quote: "top-level domain name registries as well as DNS service providers, regardless of their size"
    organisation_sector: digital_infrastructure
    reason: >
      Top-level domain name registries are in scope regardless of size and
      are essential entities.

  - id: qualified_trust
    label: "Qualified trust service provider"
    articles: ["Art. 2(2)(a)(ii)", "Art. 3(1)(b)", "Annex I, point 8"]
    effect: essential_any_size
    verified: true
    checked_against: "Directive (EU) 2022/2555, OJ L 333, 27.12.2022, p. 80, English edition, read 2026-11-23"
    evidence_quote: "qualified trust service providers and top-level domain name registries as well as DNS service providers, regardless of their size"
    organisation_sector: digital_infrastructure
    reason: >
      Qualified trust service providers are in scope regardless of size and
      are essential entities.

  - id: public_electronic_communications
    label: "Provider of public electronic communications networks or of publicly available electronic communications services"
    articles: ["Art. 2(2)(a)(i)", "Art. 3(1)(c)", "Art. 3(2)", "Annex I, point 8"]
    effect: telecom
    verified: true
    checked_against: "Directive (EU) 2022/2555, OJ L 333, 27.12.2022, p. 80, English edition, read 2026-11-23"
    evidence_quote: "Regardless of their size, this Directive also applies to providers of public electronic communications networks or of publicly available electronic communications services"
    organisation_sector: digital_infrastructure
    reason: >
      Providers of public electronic communications networks or of publicly
      available electronic communications services are in scope regardless of
      size. They are essential when they are medium-sized (Art. 3(1)(c)) or
      large (Art. 3(1)(a), because the activity sits in Annex I). Below the
      medium ceiling they are important entities (Art. 3(2)).

  - id: sole_provider
    label: "Sole provider in a Member State of a service essential for critical societal or economic activities"
    articles: ["Art. 2(2)(b)", "Art. 3(1)(e)", "Art. 3(2)"]
    effect: important_if_annex
    verified: true
    checked_against: "Directive (EU) 2022/2555, OJ L 333, 27.12.2022, p. 80, English edition, read 2026-11-23"
    evidence_quote: "the entity is the sole provider in a Member State of a service which is essential for the maintenance of critical societal or economic activities"
    reason: >
      The sole provider in a Member State of a service that is essential for
      critical societal or economic activities is in scope regardless of size,
      but only where the entity is of a type listed in Annex I or II. Being
      the sole provider does not by itself make the entity essential: that
      needs a Member State identification (Art. 3(1)(e)). Until then it is
      an important entity (Art. 3(2)).

  - id: public_admin_central
    label: "Public administration entity of central government"
    articles: ["Art. 2(2)(f)(i)", "Art. 3(1)(d)", "Annex I, point 10"]
    effect: essential_any_size
    verified: true
    checked_against: "Directive (EU) 2022/2555, OJ L 333, 27.12.2022, p. 80, English edition, read 2026-11-23"
    evidence_quote: "public administration entities referred to in Article 2(2), point (f)(i)"
    organisation_sector: public_administration
    reason: >
      A public administration entity of central government, as the Member
      State defines it, is in scope regardless of size and is an essential
      entity. What counts as central government is set by national law.

  - id: public_admin_regional
    label: "Public administration entity at regional level, where disruption could have a significant impact"
    articles: ["Art. 2(2)(f)(ii)", "Art. 3(2)", "Annex I, point 10"]
    effect: important_any_size
    verified: true
    checked_against: "Directive (EU) 2022/2555, OJ L 333, 27.12.2022, p. 80, English edition, read 2026-11-23"
    evidence_quote: "at regional level as defined by a Member State in accordance with national law that, following a risk-based assessment, provides services the disruption of which could have a significant impact"
    organisation_sector: public_administration
    reason: >
      A regional public administration entity is in scope regardless of size
      where, after a risk-based assessment, disruption of its services could
      have a significant impact on critical societal or economic activities.
      Central government is the category Art. 3(1)(d) names as essential, so
      a regional entity is an important entity unless the Member State
      identifies it as essential. The Member State defines the regional level.

  - id: public_admin_local
    label: "Public administration entity at local level"
    articles: ["Art. 2(5)(a)"]
    effect: local_public_admin
    verified: true
    checked_against: "Directive (EU) 2022/2555, OJ L 333, 27.12.2022, p. 80, English edition, read 2026-11-23"
    evidence_quote: "Member States may provide for this Directive to apply to public administration entities at local level"
    organisation_sector: public_administration
    reason: >
      Local public administration is outside the directive unless the Member
      State decides to apply it. National law decides whether this entity is
      local, regional or central.

  - id: trust_unqualified
    label: "Trust service provider that is not a qualified trust service provider"
    articles: ["Art. 2(2)(a)(ii)", "Art. 3(1)(b)", "Art. 3(2)", "Annex I, point 8"]
    effect: important_any_size
    verified: true
    checked_against: "Directive (EU) 2022/2555, OJ L 333, 27.12.2022, p. 80, English edition, read 2026-11-23"
    evidence_quote: "entities of a type referred to in Annex I or II which do not qualify as essential entities pursuant to paragraph 1 of this Article shall be considered to be important entities"
    organisation_sector: digital_infrastructure
    reason: >
      Trust service providers are in scope regardless of size. Art. 3(1)(b)
      reserves the automatic essential category for qualified trust service
      providers, so a provider that is not qualified is an important entity.

  - id: domain_registration
    label: "Entity providing domain name registration services"
    articles: ["Art. 2(4)", "Art. 3(3)"]
    effect: in_scope_unclassified
    verified: true
    checked_against: "Directive (EU) 2022/2555, OJ L 333, 27.12.2022, p. 80, English edition, read 2026-11-23"
    evidence_quote: "Regardless of their size, this Directive applies to entities providing domain name registration services"
    organisation_sector: digital_infrastructure
    reason: >
      Entities providing domain name registration services are in scope
      regardless of size (Art. 2(4)). Article 3(3) requires a list of essential
      and important entities as well as entities providing domain name
      registration services, so this category is not classified as essential
      or important by Article 3. Article 28 requires them, with TLD name
      registries, to keep a database of domain name registration data. A
      registrar that is also an Annex I or II type is still classified by
      that type.

  - id: critical_entity
    label: "Identified as a critical entity under Directive (EU) 2022/2557"
    articles: ["Art. 2(3)", "Art. 3(1)(f)"]
    effect: essential_any_size
    verified: true
    checked_against: "Directive (EU) 2022/2555, OJ L 333, 27.12.2022, p. 80, English edition, read 2026-11-23"
    evidence_quote: "Regardless of their size, this Directive applies to entities identified as critical entities under Directive (EU) 2022/2557"
    reason: >
      An entity identified as a critical entity under Directive (EU) 2022/2557
      is in scope regardless of size and is an essential entity.

