? The overall and per-requirement scores are weighted averages of the applicable controls. The evidence-backed score applies the same calculation but counts a control only when every evidence item recorded for it exists. Open items are ranked by control weight multiplied by missing coverage, so an unaddressed critical control ranks above a partially met medium one.
: sk: Celkové skóre a skóre jednotlivých požiadaviek sú vážené priemery uplatniteľných opatrení. Skóre podložené dôkazmi používa rovnaký výpočet, ale opatrenie započíta, len ak existujú všetky k nemu zaznamenané dôkazy. Otvorené položky sú zoradené podľa váhy opatrenia vynásobenej chýbajúcim pokrytím, takže neriešené kritické opatrenie je vyššie ako čiastočne splnené stredné.
  cs: Celkové skóre a skóre jednotlivých požadavků jsou vážené průměry použitelných opatření. Skóre podložené důkazy používá stejný výpočet, ale opatření započte, jen pokud existují všechny k němu zaznamenané důkazy. Otevřené položky jsou seřazeny podle váhy opatření vynásobené chybějícím pokrytím, takže neřešené kritické opatření je výše než částečně splněné střední.
  hu: A teljes és a követelményenkénti pontszám az alkalmazandó intézkedések súlyozott átlaga. A bizonyítékkal alátámasztott pontszám ugyanígy számol, de egy intézkedést csak akkor vesz figyelembe, ha minden hozzá rögzített bizonyíték létezik. A nyitott tételek sorrendje az intézkedés súlyának és a hiányzó lefedettségnek a szorzata, így egy kezeletlen kritikus intézkedés megelőz egy részben teljesített közepeset.
  pl: Wynik ogólny i wyniki dla wymagań to średnie ważone środków mających zastosowanie. Wynik poparty dowodami liczy się tak samo, ale uwzględnia środek tylko wtedy, gdy istnieją wszystkie zapisane dla niego dowody. Otwarte pozycje są szeregowane według wagi środka pomnożonej przez brakujące pokrycie, więc nieobsłużony środek krytyczny jest wyżej niż częściowo spełniony średni.
The scope could not be conclusively classified and requires further review.:
  sk: Pôsobnosť sa nepodarilo jednoznačne určiť a treba ju ďalej preveriť.
  cs: Působnost se nepodařilo jednoznačně určit a je třeba ji dále prověřit.
  hu: A hatályt nem lehetett egyértelműen megállapítani, további vizsgálat szükséges.
  pl: Nie udało się jednoznacznie ustalić zakresu; wymaga to dalszej weryfikacji.
? The size and sector outcome is the NIS2 applicability check. It does not decide whether DORA applies. DORA applies to the financial entities listed in Article 2 of Regulation (EU) 2022/2554.
: sk: Výsledok podľa veľkosti a sektora je test uplatniteľnosti NIS2. Nerozhoduje o tom, či sa uplatňuje DORA. DORA sa vzťahuje na finančné subjekty uvedené v článku 2 nariadenia (EÚ) 2022/2554.
  cs: Výsledek podle velikosti a odvětví je test použitelnosti NIS2. Nerozhoduje o tom, zda se uplatní DORA. DORA se vztahuje na finanční subjekty uvedené v článku 2 nařízení (EU) 2022/2554.
  hu: A méret és ágazat szerinti eredmény a NIS2 alkalmazhatósági vizsgálata. Nem dönti el, hogy a DORA alkalmazandó-e. A DORA az (EU) 2022/2554 rendelet 2. cikkében felsorolt pénzügyi szervezetekre vonatkozik.
  pl: Wynik według wielkości i sektora to test stosowania NIS2. Nie przesądza, czy DORA ma zastosowanie. DORA dotyczy podmiotów finansowych wymienionych w art. 2 rozporządzenia (UE) 2022/2554.
