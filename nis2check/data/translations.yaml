? 'Caveats: VCDB contains publicly reported incidents, mostly from the United States and weighted toward breaches that reach the news; it is not the full Verizon DBIR dataset. CISA KEV is US-centric; ENISA EUVD gives an EU view but is newer.'
: sk: 'Obmedzenia: VCDB obsahuje verejne nahlásené incidenty, prevažne z USA a s prevahou únikov, o ktorých písali médiá; nejde o úplný súbor údajov Verizon DBIR. CISA KEV je zameraný na USA; ENISA EUVD dáva pohľad EÚ, je však novší.'
  cs: 'Omezení: VCDB obsahuje veřejně nahlášené incidenty, převážně z USA a s převahou úniků, o kterých psala média; nejde o úplnou sadu dat Verizon DBIR. CISA KEV je zaměřen na USA; ENISA EUVD dává pohled EU, je však novější.'
  hu: 'Korlátok: a VCDB nyilvánosan bejelentett incidenseket tartalmaz, főként az Egyesült Államokból, és túlsúlyban vannak a sajtóba került adatszivárgások; nem a teljes Verizon DBIR-adatkészlet. A CISA KEV USA-központú; az ENISA EUVD uniós nézőpontot ad, de újabb.'
  pl: 'Zastrzeżenia: VCDB zawiera publicznie zgłoszone incydenty, głównie z USA, z przewagą naruszeń opisanych w mediach; nie jest to pełny zbiór danych Verizon DBIR. CISA KEV koncentruje się na USA; ENISA EUVD daje perspektywę UE, ale jest nowsza.'
