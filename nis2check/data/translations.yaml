: sk: Tieto údaje sa zobrazia v správe. Veľkosť a sektor používajú rovnaké pravidlá pôsobnosti NIS2 ako sprievodca pôsobnosťou. Výber rámca určuje, na ktoré otázky odpovedáte.
  cs: Tyto údaje se zobrazí ve zprávě. Velikost a odvětví používají stejná pravidla působnosti NIS2 jako průvodce působností. Výběr rámce určuje, na které otázky odpovídáte.
  hu: Ezek az adatok megjelennek a jelentésben. A méret és az ágazat ugyanazokat a NIS2-hatálysabályokat használja, mint a hatályvarázsló. A keret kiválasztása dönti el, mely kérdésekre válaszol.
  pl: Te dane pojawią się w raporcie. Wielkość i sektor korzystają z tych samych zasad zakresu NIS2 co kreator zakresu. Wybór ram decyduje, na które pytania odpowiadasz.
? 'This baseline is then raised by up to 50% for controls that counter threats common in recent incident data: the uplift is proportional to the combined prevalence of the threat patterns the control counters, relative to the most exposed control. Threat data can raise a weight but never lower it below the regulatory baseline, because every control is a legal requirement. Sources and links are listed in Appendix C.'
: sk: 'Tento základ sa potom zvýši až o 50 % pri opatreniach, ktoré pôsobia proti hrozbám častým v aktuálnych údajoch o incidentoch: navýšenie je úmerné súhrnnému výskytu vzorcov hrozieb, proti ktorým opatrenie pôsobí, v pomere k najexponovanejšiemu opatreniu. Údaje o hrozbách môžu váhu zvýšiť, nikdy ju však neznížia pod regulačný základ, pretože každé opatrenie je zákonnou požiadavkou. Zdroje a prepojenia sú v prílohe C.'
  cs: 'Tento základ se pak zvýší až o 50 % u opatření, která působí proti hrozbám častým v aktuálních datech o incidentech: navýšení je úměrné souhrnnému výskytu vzorců hrozeb, proti nimž opatření působí, v poměru k nejexponovanějšímu opatření. Data o hrozbách mohou váhu zvýšit, nikdy ji však nesníží pod regulatorní základ, protože každé opatření je zákonným požadavkem. Zdroje a propojení jsou v příloze C.'
  hu: 'Ezt az alapértéket legfeljebb 50%-kal megemeljük azoknál az intézkedéseknél, amelyek a friss incidensadatokban gyakori fenyegetések ellen hatnak: az emelés arányos az intézkedés által ellensúlyozott minták együttes gyakoriságával, a leginkább kitett intézkedéshez viszonyítva. A fenyegetési adatok növelhetik a súlyt, de soha nem csökkenthetik a szabályozási alapérték alá, mert minden intézkedés jogi követelmény. A források és kapcsolatok a C. mellékletben vannak.'
  pl: 'Ta wartość bazowa jest następnie podnoszona o maksymalnie 50% dla środków przeciwdziałających zagrożeniom częstym w aktualnych danych o incydentach: podwyższenie jest proporcjonalne do łącznej częstości wzorców zagrożeń, którym środek przeciwdziała, w stosunku do najbardziej narażonego środka. Dane o zagrożeniach mogą podnieść wagę, ale nigdy nie obniżą jej poniżej wartości bazowej, bo każdy środek jest wymogiem prawnym. Źródła i powiązania podano w załączniku C.'
? This report is a self-assessment and does not constitute a certification, audit opinion or legal advice. National transposition laws, implementing acts and guidance from the competent authority may impose additional or more specific requirements.
: sk: Táto správa je samohodnotením a nepredstavuje certifikáciu, výrok audítora ani právne poradenstvo. Vnútroštátne predpisy preberajúce smernicu, vykonávacie predpisy a usmernenia príslušného orgánu môžu ukladať ďalšie alebo konkrétnejšie požiadavky.
  cs: Tato zpráva je sebehodnocením a nepředstavuje certifikaci, výrok auditora ani právní poradenství. Vnitrostátní předpisy provádějící směrnici, prováděcí předpisy a pokyny příslušného orgánu mohou ukládat další nebo konkrétnější požadavky.
  hu: Ez a jelentés önértékelés, nem minősül tanúsításnak, auditori véleménynek vagy jogi tanácsadásnak. A nemzeti átültető jogszabályok, végrehajtási jogszabályok és az illetékes hatóság iránymutatásai további vagy konkrétabb követelményeket írhatnak elő.
  pl: Ten raport jest samooceną i nie stanowi certyfikacji, opinii audytora ani porady prawnej. Krajowe przepisy wdrażające, akty wykonawcze i wytyczne właściwego organu mogą nakładać dodatkowe lub bardziej szczegółowe wymagania.
