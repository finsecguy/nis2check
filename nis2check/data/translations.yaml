? Impact is the risk reduction from closing the item (control weight x missing coverage); high means at or above the median of open items. Effort is an estimate for an SME. Quick wins are the natural first wave of remediation.
: sk: Prínos je zníženie rizika po uzavretí položky (váha opatrenia x chýbajúce pokrytie); vysoký znamená na úrovni mediánu otvorených položiek alebo nad ním. Náročnosť je odhad pre MSP. Rýchle výhry sú prirodzenou prvou vlnou nápravy.
  cs: Přínos je snížení rizika po uzavření položky (váha opatření x chybějící pokrytí); vysoký znamená na úrovni mediánu otevřených položek nebo nad ním. Náročnost je odhad pro MSP. Rychlá vítězství jsou přirozenou první vlnou nápravy.
  hu: A hatás a tétel lezárásával elért kockázatcsökkentés (intézkedéssúly x hiányzó lefedettség); a nagy a nyitott tételek mediánja vagy afölött. A ráfordítás kkv-ra vonatkozó becslés. A gyors eredmények a javítás természetes első hulláma.
  pl: Wpływ to redukcja ryzyka po zamknięciu pozycji (waga środka x brakujące pokrycie); duży oznacza medianę otwartych pozycji lub więcej. Nakład to szacunek dla MŚP. Szybkie zwycięstwa to naturalna pierwsza fala działań naprawczych.
