? For financial entities, DORA is lex specialis to NIS2. Where DORA covers ICT risk management and incident reporting, the corresponding NIS2 provisions do not apply to that entity (DORA Art. 1(2); NIS2 Art. 4). Other NIS2 duties can still apply. This note is indicative and is not legal advice.
: sk: Pre finančné subjekty je DORA lex specialis k NIS2. Ak DORA upravuje riadenie rizík IKT a hlásenie incidentov, príslušné ustanovenia NIS2 sa na daný subjekt nevzťahujú (DORA čl. 1 ods. 2; NIS2 čl. 4). Ostatné povinnosti podľa NIS2 sa môžu uplatňovať naďalej. Táto poznámka je orientačná a nie je právnym poradenstvom.
  cs: Pro finanční subjekty je DORA lex specialis k NIS2. Pokud DORA upravuje řízení rizik IKT a hlášení incidentů, příslušná ustanovení NIS2 se na daný subjekt nevztahují (DORA čl. 1 odst. 2; NIS2 čl. 4). Ostatní povinnosti podle NIS2 se mohou uplatňovat i nadále. Tato poznámka je orientační a není právním poradenstvím.
  hu: A pénzügyi szervezetek esetében a DORA a NIS2-höz képest lex specialis. Ahol a DORA szabályozza az IKT-kockázatkezelést és az incidensbejelentést, ott a megfelelő NIS2-rendelkezések nem alkalmazandók az adott szervezetre (DORA 1. cikk (2) bekezdés; NIS2 4. cikk). A NIS2 egyéb kötelezettségei továbbra is vonatkozhatnak rá. Ez a megjegyzés tájékoztató jellegű, nem jogi tanácsadás.
  pl: Dla podmiotów finansowych DORA jest lex specialis wobec NIS2. Tam, gdzie DORA reguluje zarządzanie ryzykiem ICT i zgłaszanie incydentów, odpowiednie przepisy NIS2 nie mają zastosowania do danego podmiotu (DORA art. 1 ust. 2; NIS2 art. 4). Inne obowiązki wynikające z NIS2 mogą nadal mieć zastosowanie. Ta uwaga ma charakter orientacyjny i nie stanowi porady prawnej.
