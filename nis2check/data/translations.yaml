  hu: Minden válasz külön mentődik, így bármikor abbahagyhatja és később folytathatja.
  pl: Każda odpowiedź zapisuje się osobno, więc możesz w dowolnym momencie przerwać i wrócić później.
? 'Each requirement is broken down into practical controls, and each control is given a regulatory priority: critical (weight 3), high (weight 2) or medium (weight 1).'
: sk: 'Každá požiadavka je rozdelená na praktické opatrenia a každé opatrenie má regulačnú prioritu: kritická (váha 3), vysoká (váha 2) alebo stredná (váha 1).'
  cs: 'Každý požadavek je rozdělen na praktická opatření a každé opatření má regulatorní prioritu: kritická (váha 3), vysoká (váha 2) nebo střední (váha 1).'
  hu: 'Minden követelmény gyakorlati intézkedésekre bomlik, és minden intézkedés szabályozási prioritást kap: kritikus (3-as súly), magas (2-es súly) vagy közepes (1-es súly).'
  pl: 'Każde wymaganie jest podzielone na praktyczne środki, a każdy środek ma priorytet regulacyjny: krytyczny (waga 3), wysoki (waga 2) lub średni (waga 1).'
Effort:
  sk: Náročnosť
  cs: Náročnost
  hu: Ráfordítás
  pl: Nakład
? Effort is an estimate (low, medium, high) of the work needed for an SME to implement the control. Risk reduction per unit of effort divides the risk reduction by 1, 2 or 3 respectively and drives the impact vs effort matrix.
: sk: Náročnosť je odhad (nízka, stredná, vysoká) práce, ktorú MSP potrebuje na zavedenie opatrenia. Zníženie rizika na jednotku náročnosti delí zníženie rizika číslom 1, 2 alebo 3 a určuje maticu prínos a náročnosť.
  cs: Náročnost je odhad (nízká, střední, vysoká) práce, kterou MSP potřebuje k zavedení opatření. Snížení rizika na jednotku náročnosti dělí snížení rizika číslem 1, 2 nebo 3 a určuje matici přínos a náročnost.
  hu: A ráfordítás becslés (alacsony, közepes, magas) arról, mennyi munka kell egy kkv-nak az intézkedés bevezetéséhez. Az egységnyi ráfordításra jutó kockázatcsökkentés a kockázatcsökkentést 1-gyel, 2-vel vagy 3-mal osztja, és ez adja a hatás–ráfordítás mátrixot.
  pl: Nakład to szacunek (niski, średni, wysoki) pracy potrzebnej MŚP do wdrożenia środka. Redukcja ryzyka na jednostkę nakładu dzieli redukcję ryzyka przez 1, 2 lub 3 i wyznacza macierz wpływu i nakładu.
