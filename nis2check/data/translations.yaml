? Based on the information provided, the organisation appears to fall outside the direct scope of NIS2. In-scope customers may still require NIS2-aligned controls through their supply chain obligations.
: sk: Podľa poskytnutých údajov organizácia zrejme nepatrí do priamej pôsobnosti NIS2. Zákazníci, ktorí do pôsobnosti patria, však môžu požadovať opatrenia v súlade s NIS2 v rámci svojich povinností v dodávateľskom reťazci.
  cs: Podle poskytnutých údajů organizace zřejmě nespadá do přímé působnosti NIS2. Zákazníci, kteří do působnosti spadají, však mohou požadovat opatření v souladu s NIS2 v rámci svých povinností v dodavatelském řetězci.
  hu: A megadott adatok alapján a szervezet láthatóan nem tartozik a NIS2 közvetlen hatálya alá. A hatály alá tartozó ügyfelek azonban ellátásilánc-kötelezettségeik keretében NIS2-nek megfelelő intézkedéseket kérhetnek.
  pl: Na podstawie podanych informacji organizacja wydaje się nie podlegać bezpośrednio NIS2. Klienci objęci NIS2 mogą jednak wymagać środków zgodnych z NIS2 w ramach obowiązków dotyczących łańcucha dostaw.
