  cs: Podle poskytnutých údajů organizace pravděpodobně spadá do působnosti NIS2 jako základní subjekt.
  hu: A megadott adatok alapján a szervezet valószínűleg alapvető szervezetként a NIS2 hatálya alá tartozik.
  pl: Na podstawie podanych informacji organizacja prawdopodobnie podlega NIS2 jako podmiot kluczowy.
