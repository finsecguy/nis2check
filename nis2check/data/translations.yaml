? Answers are scored as met = 1, partially met = 0.5, not met = 0 and not assessed = 0. Controls marked not applicable are excluded.
: sk: 'Odpovede sa hodnotia takto: splnené = 1, čiastočne splnené = 0,5, nesplnené = 0, neposúdené = 0. Opatrenia označené ako neuplatniteľné sa nezapočítavajú.'
  cs: 'Odpovědi se hodnotí takto: splněno = 1, částečně splněno = 0,5, nesplněno = 0, neposouzeno = 0. Opatření označená jako nepoužitelná se nezapočítávají.'
  hu: 'A válaszok pontozása: teljesítve = 1, részben teljesítve = 0,5, nem teljesítve = 0, nem értékelt = 0. A nem alkalmazandónak jelölt intézkedések kimaradnak.'
  pl: 'Odpowiedzi są punktowane: spełnione = 1, częściowo spełnione = 0,5, niespełnione = 0, nieocenione = 0. Środki oznaczone jako nie dotyczy są pomijane.'
