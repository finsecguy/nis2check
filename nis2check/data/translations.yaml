? Prevalence is the share of confirmed or suspected incident events in the VERIS Community Database (VCDB) matching each threat pattern, with mass campaigns counted once. Links between controls and threat patterns come from MITRE ATT&CK mitigation relationships, plus catalogue links for patterns ATT&CK does not cover (human error, insider misuse, physical loss, supplier involvement).
: sk: Výskyt je podiel potvrdených alebo podozrivých incidentov vo VERIS Community Database (VCDB), ktoré zodpovedajú danému vzorcu hrozby; masové kampane sa počítajú raz. Prepojenia opatrení a vzorcov hrozieb pochádzajú z mitigačných vzťahov MITRE ATT&CK, doplnených o prepojenia z katalógu pre vzorce, ktoré ATT&CK nepokrýva (ľudská chyba, zneužitie zo strany zamestnanca, fyzická strata, účasť dodávateľa).
  cs: Výskyt je podíl potvrzených nebo podezřelých incidentů ve VERIS Community Database (VCDB), které odpovídají danému vzorci hrozby; masové kampaně se počítají jednou. Propojení opatření a vzorců hrozeb pochází z mitigačních vztahů MITRE ATT&CK, doplněných o propojení z katalogu pro vzorce, které ATT&CK nepokrývá (lidská chyba, zneužití ze strany zaměstnance, fyzická ztráta, účast dodavatele).
  hu: A gyakoriság a VERIS Community Database (VCDB) azon megerősített vagy gyanított incidenseinek aránya, amelyek az adott fenyegetési mintának felelnek meg; a tömeges kampányok egyszer számítanak. Az intézkedések és minták kapcsolata a MITRE ATT&CK mitigációs kapcsolataiból származik, kiegészítve katalógusbeli kapcsolatokkal azokra a mintákra, amelyeket az ATT&CK nem fed le (emberi hiba, belső visszaélés, fizikai elvesztés, beszállítói érintettség).
  pl: Częstość to udział potwierdzonych lub podejrzewanych incydentów w VERIS Community Database (VCDB) pasujących do danego wzorca zagrożenia; kampanie masowe liczone są raz. Powiązania środków ze wzorcami zagrożeń pochodzą z relacji mitygacji MITRE ATT&CK, uzupełnionych o powiązania z katalogu dla wzorców, których ATT&CK nie obejmuje (błąd ludzki, nadużycie przez pracownika, fizyczna utrata, udział dostawcy).
