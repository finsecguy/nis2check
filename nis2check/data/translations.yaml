? 'Quick wins (high impact, low effort): {n}, for example {ids}. Closing these first gives the fastest reduction in risk (see section 3.3).'
: sk: 'Rýchle výhry (vysoký prínos, nízka náročnosť): {n}, napríklad {ids}. Ich uzavretie ako prvých najrýchlejšie zníži riziko (pozri časť 3.3).'
  cs: 'Rychlá vítězství (vysoký přínos, nízká náročnost): {n}, například {ids}. Jejich uzavření jako prvních nejrychleji sníží riziko (viz oddíl 3.3).'
  hu: 'Gyors eredmények (nagy hatás, kis ráfordítás): {n}, például {ids}. Ezek lezárása csökkenti a leggyorsabban a kockázatot (lásd a 3.3. pontot).'
  pl: 'Szybkie zwycięstwa (duży wpływ, mały nakład): {n}, na przykład {ids}. Ich zamknięcie w pierwszej kolejności najszybciej zmniejsza ryzyko (zob. sekcja 3.3).'
? 'RAG: green 70% and above, amber 40 to 69%, red below 40%. Green needs evidence: a requirement answered as in place without evidence stays amber. Grey means not assessed yet. "Evidenced" counts only answers supported by existing evidence. In the bar, the solid part is backed by evidence and the light part is not yet.'
: sk: 'Farby: zelená 70 % a viac, oranžová 40 až 69 %, červená pod 40 %. Zelená vyžaduje dôkazy: požiadavka označená ako zavedená bez dôkazov zostáva oranžová. Sivá znamená zatiaľ neposúdené. „Podložené“ započítava len odpovede podložené existujúcimi dôkazmi. V pruhu je plná časť podložená dôkazmi, svetlá zatiaľ nie.'
  cs: 'Barvy: zelená 70 % a více, oranžová 40 až 69 %, červená pod 40 %. Zelená vyžaduje důkazy: požadavek označený jako zavedený bez důkazů zůstává oranžový. Šedá znamená zatím neposouzeno. „Podloženo“ započítává jen odpovědi podložené existujícími důkazy. V pruhu je plná část podložena důkazy, světlá zatím ne.'
  hu: 'Színek: zöld 70% és felette, borostyán 40–69%, piros 40% alatt. A zöldhöz bizonyíték kell: a bizonyíték nélkül bevezetettnek jelölt követelmény borostyán marad. A szürke még nem értékeltet jelent. Az „Alátámasztva” csak a meglévő bizonyítékkal alátámasztott válaszokat számolja. A sávban a teli rész bizonyítékkal alátámasztott, a halvány rész még nem.'
  pl: 'Kolory: zielony 70% i więcej, bursztynowy 40–69%, czerwony poniżej 40%. Zielony wymaga dowodów: wymaganie oznaczone jako wdrożone bez dowodów pozostaje bursztynowe. Szary oznacza jeszcze nieocenione. „Poparte” liczy tylko odpowiedzi poparte istniejącymi dowodami. Na pasku pełna część jest poparta dowodami, jasna jeszcze nie.'
