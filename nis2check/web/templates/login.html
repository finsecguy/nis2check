{% extends "auth_base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<h1>Sign in</h1>
{% for p in providers %}
  <a class="btn secondary sso" href="{{ url_for('auth.sso_start', provider=p.key) }}">{{ p.label }}</a>
{% endfor %}
{% if local %}
  {% if providers %}<p class="or">Or use your email and password.</p>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>
    <div class="actions"><button class="btn" type="submit">Sign in</button></div>
  </form>
{% endif %}
{% endblock %}
