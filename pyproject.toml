[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nis2check"
version = "0.2.1"
description = "Self-hosted NIS2 gap assessment: questionnaire, evidence, threat-informed priorities and audit-ready reports"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Herman Kaufman" }]
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "Jinja2>=3.1"]
keywords = ["nis2", "grc", "compliance", "cybersecurity", "gap-analysis", "risk"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
    "Intended Audience :: Information Technology",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
pdf = ["weasyprint>=60"]
web = ["Flask>=3.0", "Flask-WTF>=1.2", "SQLAlchemy>=2.0", "Authlib>=1.3", "requests>=2.31",
       "gunicorn>=22", "weasyprint>=60", "fpdf2==2.8.9"]

[project.scripts]
nis2check = "nis2check.cli:main"

[tool.setuptools.packages.find]
include = ["nis2check*"]

[tool.setuptools.package-data]
nis2check = ["data/*.yaml", "templates/*.j2", "web/templates/*.html", "web/static/*.css", "web/static/*.js",
             "web/static/*.svg", "web/static/*.png", "web/static/*.ico", "web/static/*.webmanifest", "web/static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
