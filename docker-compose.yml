services:
  nis2check:
    build: .
    image: nis2check:latest
    container_name: nis2check
    ports:
      - "${NIS2_BIND:-127.0.0.1}:8080:8080"
    env_file:
      - path: .env
        required: false
    volumes:
      - nis2check-data:/data
    restart: unless-stopped

volumes:
  nis2check-data:
